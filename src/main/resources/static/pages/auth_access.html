<!DOCTYPE html>
<html class="light" lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CampusShare | 登录注册</title>
<script src="/pages/assets/vendor/tailwindcss.js"></script>
<link href="/pages/assets/fonts/campusshare-fonts.css" rel="stylesheet"/>
<link href="/pages/assets/fonts/material-symbols.css" rel="stylesheet"/>
<link href="/pages/assets/css/campusshare-modern.css" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    primary: "#005d90",
                    "primary-strong": "#004b74",
                    "primary-soft": "#eef6fb",
                    surface: "#f5f5f7",
                    card: "#ffffff",
                    line: "rgba(120,133,150,0.16)",
                    muted: "#64748b",
                    ink: "#172033",
                    error: "#b42318",
                    success: "#0a8a4f"
                },
                borderRadius: {
                    DEFAULT: "8px",
                    md: "10px",
                    lg: "12px",
                    xl: "16px",
                    full: "999px"
                },
                fontFamily: {
                    headline: ["Manrope", "Noto Sans SC", "Microsoft YaHei", "sans-serif"],
                    body: ["Inter", "Noto Sans SC", "Microsoft YaHei", "sans-serif"]
                }
            }
        }
    };
</script>
<style>
    * { box-sizing: border-box; }
    html { text-rendering: optimizeLegibility; }

    body {
        min-height: 100vh;
        margin: 0;
        font-family: var(--cs-font-body);
        color: var(--cs-ink);
        position: relative;
        overflow-x: hidden;
        background:
            radial-gradient(circle at 18% 8%,  rgba(0,93,144,0.10), transparent 25rem),
            radial-gradient(circle at 84% 12%, rgba(52,84,209,0.08), transparent 24rem),
            linear-gradient(180deg, #ffffff 0%, #f5f5f7 45%);
        text-wrap: pretty;
    }

    /* Ambient orbs — login page only */
    body::before,
    body::after {
        content: "";
        position: fixed;
        z-index: -1;
        width: 34rem;
        height: 34rem;
        border-radius: var(--cs-radius-full);
        pointer-events: none;
        filter: blur(2px);
        will-change: transform;
    }
    body::before {
        left: -7rem;
        top: -8rem;
        background: radial-gradient(circle, rgba(0,93,144,0.12) 0%, rgba(0,93,144,0.06) 38%, transparent 68%);
        animation: authOrbDriftA 18s ease-in-out infinite alternate;
    }
    body::after {
        right: -9rem;
        top: -5rem;
        background: radial-gradient(circle, rgba(52,84,209,0.10) 0%, rgba(0,93,144,0.04) 42%, transparent 70%);
        animation: authOrbDriftB 23s ease-in-out infinite alternate;
    }

    h1, h2, h3, .headline-font {
        font-family: var(--cs-font-headline);
        letter-spacing: 0;
    }

    .material-symbols-outlined {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        font-variation-settings: "FILL" 0, "wght" 430, "GRAD" 0, "opsz" 24;
    }

    /* ----- Auth card ----- */
    .auth-card {
        border: 1px solid var(--cs-line);
        background: var(--cs-card-glass);
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
        box-shadow: var(--cs-shadow-lg);
    }

    /* ----- Field inputs ----- */
    .auth-field input,
    .auth-field select {
        height: 44px;
        border: 1px solid var(--cs-line);
        background: rgba(255,255,255,0.88);
        border-radius: var(--cs-radius-sm);
        padding: 0 12px;
        font-size: 15px;
        color: var(--cs-ink);
        width: 100%;
        outline: none;
        transition:
            border-color 180ms var(--cs-ease),
            box-shadow 180ms var(--cs-ease);
    }
    .auth-field input::placeholder {
        color: var(--cs-muted);
        font-size: 14px;
    }
    .auth-field input:hover,
    .auth-field select:hover {
        border-color: rgba(0,93,144,0.24);
    }
    .auth-field input:focus,
    .auth-field select:focus {
        border-color: var(--cs-primary);
        box-shadow: var(--cs-shadow-focus);
    }
    .auth-field input.with-icon-left {
        padding-left: 40px;
    }
    .auth-field input.with-icon-right {
        padding-right: 44px;
    }

    /* ----- Tab switcher ----- */
    .auth-tabs {
        display: flex;
        background: rgba(120,133,150,0.08);
        border-radius: var(--cs-radius-md);
        padding: 3px;
        gap: 2px;
    }
    .auth-tabs button {
        flex: 1;
        height: 36px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        background: transparent;
        color: var(--cs-muted);
        border: none;
        cursor: pointer;
        transition:
            background-color 180ms var(--cs-ease),
            color 180ms var(--cs-ease),
            box-shadow 180ms var(--cs-ease);
    }
    /* JS sets these classes dynamically; keep the active state here */
    .auth-tabs button.tab-active {
        background: var(--cs-card);
        color: var(--cs-primary);
        box-shadow: var(--cs-shadow-sm);
    }

    /* ----- Visual side ----- */
    .auth-visual h1 {
        font-size: clamp(3rem, 4.8vw, 4.55rem);
        font-weight: 950;
        line-height: 0.98;
        letter-spacing: -0.01em;
        text-shadow: 0 1px 0 rgba(255,255,255,0.72);
    }

    /* ----- Feature mini cards ----- */
    .auth-feature-card {
        border-radius: 16px;
        background: rgba(255,255,255,0.78);
        border: 1px solid rgba(120,133,150,0.12);
        box-shadow: var(--cs-shadow-sm);
        padding: 16px;
    }

    /* ----- Password toggle ----- */
    [data-password-toggle] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2.5rem;
        height: 2.5rem;
        line-height: 1;
        color: var(--cs-muted);
        border: none;
        background: transparent;
        cursor: pointer;
    }
    [data-password-toggle]:hover {
        color: var(--cs-primary);
    }
    [data-password-toggle-icon] {
        font-size: 20px;
        line-height: 1;
    }

    /* ----- Register container (JS builds this) ----- */
    [data-register-fields] {
        padding: 4px;
        margin-left: -4px;
        margin-right: -4px;
    }

    /* ----- Layout ----- */
    main[data-auth-shell] {
        grid-template-columns: minmax(0, 520px) 440px;
        justify-content: center;
    }

    /* ----- Submit button override ----- */
    .auth-submit {
        width: 100%;
        height: 44px;
        border-radius: var(--cs-radius-md);
        background: var(--cs-primary);
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
        border: none;
        cursor: pointer;
        transition:
            background-color 180ms var(--cs-ease),
            transform 120ms var(--cs-ease);
        box-shadow: none;
    }
    .auth-submit:hover {
        background: var(--cs-primary-strong);
        transform: translateY(-1px);
    }
    .auth-submit:active {
        transform: scale(0.97);
    }

    /* ----- Field label ----- */
    .auth-field-label {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
        font-weight: 500;
        color: var(--cs-muted);
        letter-spacing: 0.01em;
    }

    /* ----- Animations ----- */
    @keyframes authModeSwitch {
        0%   { opacity: 0.76; transform: translateY(8px) scale(0.992); }
        100% { opacity: 1;    transform: translateY(0)   scale(1); }
    }
    @keyframes authFieldShake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-7px); }
        40%, 80% { transform: translateX(7px); }
    }
    @keyframes authOrbDriftA {
        0%   { transform: translate3d(0, 0, 0) scale(1); }
        37%  { transform: translate3d(3.5rem, 2rem, 0) scale(1.06); }
        71%  { transform: translate3d(1rem, 5rem, 0) scale(0.96); }
        100% { transform: translate3d(5rem, 1.5rem, 0) scale(1.08); }
    }
    @keyframes authOrbDriftB {
        0%   { transform: translate3d(0, 0, 0) scale(1); }
        29%  { transform: translate3d(-4rem, 2.5rem, 0) scale(1.04); }
        64%  { transform: translate3d(-1rem, 6rem, 0) scale(0.97); }
        100% { transform: translate3d(-5rem, 1rem, 0) scale(1.07); }
    }

    .auth-mode-switching { animation: authModeSwitch 260ms var(--cs-ease); }
    .auth-field-shake    { animation: authFieldShake 360ms ease; }

    @media (max-width: 1120px) {
        main[data-auth-shell] {
            max-width: 980px;
            grid-template-columns: minmax(0, 500px) 420px;
            gap: 2.5rem;
        }
        .auth-visual h1 {
            font-size: clamp(3rem, 6.5vw, 4.25rem);
        }
    }
    @media (max-width: 900px) {
        .auth-visual { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            transition-duration: 0.01ms !important;
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
        }
    }
</style>
</head>
<body class="flex min-h-screen flex-col">

<main class="mx-auto grid w-full max-w-[1100px] flex-1 grid-cols-1 items-center gap-14 px-5 py-10 lg:px-8"
      data-auth-shell>

    <!-- Left: Brand visual -->
    <section class="auth-visual mx-auto w-full max-w-[520px]">
        <p class="mb-5 inline-flex items-center gap-2 rounded-full px-4 py-2 text-xs font-extrabold tracking-[0.18em]"
           style="background:var(--cs-primary-soft);color:var(--cs-primary);">
            <span class="material-symbols-outlined" style="font-size:15px;">verified</span>
            CAMPUS TRUSTED MARKET
        </p>
        <h1 class="headline-font max-w-full font-extrabold text-slate-950">CampusShare</h1>
        <p class="mt-5 max-w-xl text-lg leading-8" style="color:var(--cs-muted);">
            校园二手交易 · 学术资源共享 · 组队招募<br>
            一站式校园资源共享平台
        </p>
        <div class="mt-10 grid max-w-xl grid-cols-3 gap-3">
            <div class="auth-feature-card">
                <span class="material-symbols-outlined" style="color:var(--cs-primary);">verified_user</span>
                <p class="mt-3 text-sm font-bold" style="color:var(--cs-ink);">身份审核</p>
                <p class="mt-1 text-xs" style="color:var(--cs-muted);">实名认证体系</p>
            </div>
            <div class="auth-feature-card">
                <span class="material-symbols-outlined" style="color:var(--cs-primary);">receipt_long</span>
                <p class="mt-3 text-sm font-bold" style="color:var(--cs-ink);">订单追踪</p>
                <p class="mt-1 text-xs" style="color:var(--cs-muted);">全流程透明</p>
            </div>
            <div class="auth-feature-card">
                <span class="material-symbols-outlined" style="color:var(--cs-primary);">school</span>
                <p class="mt-3 text-sm font-bold" style="color:var(--cs-ink);">资料积分</p>
                <p class="mt-1 text-xs" style="color:var(--cs-muted);">共享换积分</p>
            </div>
        </div>
    </section>

    <!-- Right: Auth card -->
    <section class="auth-card mx-auto w-full max-w-[440px] overflow-hidden rounded-2xl">
        <!-- Card header -->
        <div class="px-8 pb-5 pt-8 text-center">
            <h2 class="headline-font text-2xl font-extrabold" style="color:var(--cs-primary);">CampusShare</h2>
            <p class="mt-1.5 text-sm" style="color:var(--cs-muted);">访问校园资源共享平台</p>
        </div>

        <!-- Tab switcher — JS relies on: querySelectorAll("main .border-b button")[0/1] -->
        <div class="border-b px-8 pb-5" style="border-color:var(--cs-line);">
            <div class="auth-tabs">
                <button type="button">登录</button>
                <button type="button">注册</button>
            </div>
        </div>

        <!-- Form body -->
        <div class="p-8">
            <form class="space-y-4">
                <div class="grid grid-cols-1 gap-4 md:grid-cols-2">

                    <!-- 学号 — JS: textInputs[0] / accountInput -->
                    <div class="auth-field space-y-1 md:col-span-2">
                        <label class="auth-field-label" for="auth-account">学号</label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-sm"
                                  style="color:var(--cs-muted);font-size:18px;">person</span>
                            <input class="with-icon-left" id="auth-account"
                                   maxlength="11" placeholder="请输入 11 位学号" type="text"/>
                        </div>
                    </div>

                    <!-- 密码 — JS: passwordInput -->
                    <div class="auth-field space-y-1 md:col-span-2">
                        <label class="auth-field-label" for="auth-password">密码</label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2"
                                  style="color:var(--cs-muted);font-size:18px;">lock</span>
                            <input class="with-icon-left with-icon-right" id="auth-password"
                                   placeholder="请输入密码（至少 8 位）" type="password"/>
                            <button aria-label="显示密码" class="absolute right-2 top-1/2 -translate-y-1/2"
                                    data-password-toggle="" type="button">
                                <span class="material-symbols-outlined" data-password-toggle-icon="">visibility_off</span>
                            </button>
                        </div>
                    </div>

                    <!-- 用户名 — JS: textInputs[1] / userNameInput -->
                    <div class="auth-field space-y-1 md:col-span-2">
                        <label class="auth-field-label" for="auth-username">用户名</label>
                        <input id="auth-username" placeholder="请输入用户名（2-20字符）" type="text"/>
                    </div>

                    <!-- 学院 — JS: selects[0] / collegeSelect -->
                    <div class="auth-field space-y-1">
                        <label class="auth-field-label" for="auth-college">学院</label>
                        <select class="appearance-none" id="auth-college">
                            <option value="">请选择学院</option>
                            <option>工程学院</option>
                            <option>理学院</option>
                            <option>人文艺术学院</option>
                            <option>商学院</option>
                            <option>医学院</option>
                        </select>
                    </div>

                    <!-- 年级 — JS: selects[1] / gradeSelect -->
                    <div class="auth-field space-y-1">
                        <label class="auth-field-label" for="auth-grade">年级</label>
                        <select class="appearance-none" id="auth-grade">
                            <option value="">请选择年级</option>
                            <option>本科生</option>
                            <option>研究生</option>
                            <option>博士生</option>
                            <option>教师</option>
                            <option>教职工</option>
                        </select>
                    </div>

                    <!-- 邮箱 — JS: emailInput -->
                    <div class="auth-field space-y-1 md:col-span-2">
                        <label class="auth-field-label" for="auth-email">邮箱</label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2"
                                  style="color:var(--cs-muted);font-size:18px;">mail</span>
                            <input class="with-icon-left" id="auth-email"
                                   placeholder="name@campus.edu.cn" type="email"/>
                        </div>
                    </div>

                </div><!-- /grid -->

                <!-- Submit — JS: button[type='submit'] -->
                <button class="auth-submit mt-2" type="submit">登录</button>

                <!-- Security notice -->
                <div class="flex items-center gap-3 py-1">
                    <div class="h-px flex-1" style="background:var(--cs-line);"></div>
                    <span class="text-[10px] font-extrabold uppercase tracking-[0.18em]"
                          style="color:var(--cs-muted);">安全网关</span>
                    <div class="h-px flex-1" style="background:var(--cs-line);"></div>
                </div>
                <div class="flex justify-center gap-6">
                    <span class="flex items-center gap-1.5 text-xs font-medium" style="color:var(--cs-muted);">
                        <span class="material-symbols-outlined" style="font-size:15px;">shield</span>SSL 加密
                    </span>
                    <span class="flex items-center gap-1.5 text-xs font-medium" style="color:var(--cs-muted);">
                        <span class="material-symbols-outlined" style="font-size:15px;">verified_user</span>审核准入
                    </span>
                </div>

            </form>
        </div>
    </section>

</main>

<footer class="px-6 py-6">
    <div class="mx-auto flex max-w-[1100px] items-center justify-between border-t pt-5"
         style="border-color:var(--cs-line);">
        <span class="headline-font text-sm font-extrabold" style="color:var(--cs-ink);">CampusShare</span>
        <span class="text-xs" style="color:var(--cs-muted);">© 2026 CampusShare</span>
        <span class="text-xs font-medium" style="color:var(--cs-muted);">校园资源共享平台</span>
    </div>
</footer>

<script src="/pages/assets/js/campusshare-api.js?v=20260515"></script>
<script src="/pages/assets/js/auth-access.js?v=20260515"></script>
</body>
</html>
