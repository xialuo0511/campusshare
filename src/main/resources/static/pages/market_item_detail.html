<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CampusShare · 详情</title>

<link rel="stylesheet" href="/pages/assets/fonts/campusshare-fonts.css" />
<link rel="stylesheet" href="/pages/assets/fonts/material-symbols.css" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  :root {
    --cs-primary: #005d90;
    --cs-primary-strong: #004b74;
    --cs-primary-soft: #eef6fb;
    --cs-accent: #3454d1;
    --cs-ink: #0b1320;
    --cs-ink-soft: #172033;
    --cs-muted: #64748b;
    --cs-muted-2: #94a3b8;
    --cs-line: rgba(120, 133, 150, 0.18);
    --cs-line-strong: rgba(120, 133, 150, 0.32);
    --cs-card-bg: rgba(255, 255, 255, 0.78);
    --cs-shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04), 0 6px 18px -8px rgba(15, 23, 42, 0.08);
    --cs-shadow-md: 0 14px 36px -16px rgba(8, 25, 53, 0.18);
    --cs-shadow-lg: 0 30px 60px -24px rgba(8, 25, 53, 0.22);
    --cs-shadow-focus: 0 0 0 4px rgba(0, 93, 144, 0.16);
    --cs-r-sm: 10px;
    --cs-r-md: 14px;
    --cs-r-lg: 18px;
    --cs-r-xl: 24px;
    --cs-ease: cubic-bezier(0.22, 1, 0.36, 1);
    --bg-base: #f4f6fa;
    --green: #0a8a4f;
    --green-soft: #e7f6ee;
    --amber: #b45309;
    --amber-soft: #fff4e0;
    --rose: #be123c;
    --rose-soft: #ffe4e9;
    --violet: #7c3aed;
    --violet-soft: #f1ebff;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg-base);
    color: var(--cs-ink);
    font-family: 'Inter', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body {
    min-height: 100vh;
    background:
      radial-gradient(900px 400px at 8% -10%, rgba(0,93,144,0.06), transparent 60%),
      radial-gradient(800px 400px at 110% 0%, rgba(52,84,209,0.06), transparent 60%),
      linear-gradient(180deg, #ffffff 0%, #f4f6fa 320px);
    text-wrap: pretty;
  }
  .headline { font-family: 'Manrope', sans-serif; letter-spacing: -0.01em; }
  .material-symbols-outlined {
    font-family: 'Material Symbols Outlined';
    font-variation-settings: 'FILL' 0, 'wght' 430, 'GRAD' 0, 'opsz' 24;
    user-select: none;
    line-height: 1;
  }

  /* ───────── Top nav ───────── */
  .nav {
    position: sticky; top: 0; z-index: 30;
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    background: rgba(255,255,255,0.82);
    border-bottom: 1px solid var(--cs-line);
  }
  .nav-inner {
    max-width: 1440px; margin: 0 auto; height: 64px;
    padding: 0 clamp(16px, 3vw, 32px);
    display: flex; align-items: center; gap: 20px;
  }
  .brand { display: inline-flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .brand .logo {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, var(--cs-primary), var(--cs-accent));
    display: grid; place-items: center; color: #fff;
    box-shadow: 0 8px 20px -8px rgba(0,93,144,0.55), inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .brand .logo .material-symbols-outlined { font-size: 19px; font-variation-settings: 'FILL' 1; }
  .brand .name {
    font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 19px;
    color: var(--cs-ink); letter-spacing: -0.01em;
  }
  .search-wrap {
    flex: 1; max-width: 520px; height: 40px;
    border: 1px solid var(--cs-line);
    background: rgba(255,255,255,0.78);
    border-radius: 999px;
    display: flex; align-items: center;
    padding: 0 6px 0 14px; gap: 10px;
    transition: all 200ms var(--cs-ease);
  }
  .search-wrap:hover { border-color: var(--cs-line-strong); }
  .search-wrap:focus-within { border-color: var(--cs-primary); box-shadow: var(--cs-shadow-focus); background: #fff; }
  .search-wrap .material-symbols-outlined { font-size: 18px; color: var(--cs-muted); }
  .search-wrap input {
    flex: 1; border: none; outline: none; background: transparent;
    font-family: inherit; font-size: 14px; color: var(--cs-ink); min-width: 0;
  }
  .kbd {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 3px 7px; border-radius: 6px;
    background: rgba(0,0,0,0.04); color: var(--cs-muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; font-weight: 600;
    border: 1px solid var(--cs-line);
    pointer-events: none; user-select: none; flex-shrink: 0;
  }
  .nav-links { display: flex; gap: 2px; }
  .nav-link {
    padding: 8px 14px; border-radius: 999px;
    font-size: 14px; font-weight: 600; color: var(--cs-muted);
    border: none; background: transparent; cursor: pointer;
    font-family: inherit;
    transition: all 180ms var(--cs-ease);
  }
  .nav-link:hover { background: rgba(0,0,0,0.04); color: var(--cs-ink-soft); }
  .nav-link.active { background: var(--cs-primary-soft); color: var(--cs-primary); }
  .nav-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 10px;
    border: 1px solid var(--cs-line); background: rgba(255,255,255,0.6);
    cursor: pointer; display: grid; place-items: center; position: relative;
    color: var(--cs-ink-soft); transition: all 180ms var(--cs-ease);
  }
  .icon-btn:hover { border-color: var(--cs-line-strong); background: #fff; transform: translateY(-1px); }
  .icon-btn .material-symbols-outlined { font-size: 19px; }
  .icon-btn .dot-badge {
    position: absolute; top: -5px; right: -5px;
    min-width: 18px; height: 18px; border-radius: 999px;
    background: #ef4444; color: #fff;
    font-size: 10px; font-weight: 700; padding: 0 5px;
    display: inline-flex; align-items: center; justify-content: center; line-height: 1;
    border: 2px solid #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.08);
  }
  .primary-btn {
    height: 38px; padding: 0 18px 0 14px; border-radius: 999px; border: none;
    background: linear-gradient(135deg, var(--cs-primary), var(--cs-accent));
    color: #fff; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 13.5px;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    box-shadow: 0 10px 22px -10px rgba(0,93,144,0.55), inset 0 1px 0 rgba(255,255,255,0.22);
  }
  .avatar-btn {
    width: 38px; height: 38px; border-radius: 999px;
    background: linear-gradient(135deg, #ffd089, #f0a35a);
    color: #fff; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 14px;
    display: grid; place-items: center; cursor: pointer;
    border: 2px solid #fff; box-shadow: var(--cs-shadow-sm);
  }

  /* ───────── Detail layout ───────── */
  .detail-shell {
    max-width: 1280px; margin: 0 auto;
    padding: 28px clamp(16px, 3vw, 32px) 32px;
  }

  .crumb {
    display: flex; align-items: center;
    justify-content: space-between; margin-bottom: 18px;
  }
  .crumb-left {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; color: var(--cs-muted);
  }
  .crumb-left a {
    color: var(--cs-muted); text-decoration: none; cursor: pointer;
    transition: color 160ms var(--cs-ease);
  }
  .crumb-left a:hover { color: var(--cs-primary); }
  .crumb-left .material-symbols-outlined { font-size: 14px; color: var(--cs-muted-2); }
  .crumb-left .cur { color: var(--cs-ink-soft); font-weight: 600; }

  .back-btn {
    height: 32px; padding: 0 12px; border-radius: 999px;
    border: 1px solid var(--cs-line); background: rgba(255,255,255,0.6);
    cursor: pointer; font-family: inherit; font-size: 12.5px; font-weight: 600;
    color: var(--cs-ink-soft); display: inline-flex; align-items: center; gap: 4px;
    transition: all 160ms var(--cs-ease);
  }
  .back-btn:hover { border-color: var(--cs-primary); color: var(--cs-primary); background: #fff; }
  .back-btn .material-symbols-outlined { font-size: 16px; }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    gap: 32px; align-items: start;
  }
  @media (max-width: 1024px) {
    .layout { grid-template-columns: 1fr; }
    .side { position: static !important; }
  }

  /* ═════════ MAIN COLUMN ═════════ */
  .main { min-width: 0; display: flex; flex-direction: column; gap: 28px; }

  .hero-visual {
    border-radius: var(--cs-r-xl); overflow: hidden;
    background: #fff; border: 1px solid var(--cs-line);
    box-shadow: var(--cs-shadow-sm);
  }

  /* Gallery */
  .gallery-main {
    aspect-ratio: 4/3; position: relative;
    background: linear-gradient(135deg, var(--g1, #e6cf94), var(--g2, #b88a3e));
    display: grid; place-items: center;
  }
  .gallery-main .glyph {
    font-family: 'Manrope', sans-serif; font-weight: 900; font-size: 120px;
    letter-spacing: -0.04em; color: rgba(255,255,255,0.9); mix-blend-mode: overlay;
  }
  .gallery-main .img-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 40px; height: 40px; border-radius: 999px; border: none;
    background: rgba(255,255,255,0.95); cursor: pointer;
    display: grid; place-items: center; color: var(--cs-ink-soft);
    box-shadow: var(--cs-shadow-md); transition: transform 160ms var(--cs-ease);
  }
  .gallery-main .img-nav.left { left: 18px; }
  .gallery-main .img-nav.right { right: 18px; }
  .gallery-main .img-nav:hover { transform: translateY(-50%) scale(1.06); }
  .gallery-main .img-nav .material-symbols-outlined { font-size: 22px; }
  .gallery-main .img-counter {
    position: absolute; right: 18px; bottom: 18px;
    background: rgba(0,0,0,0.5); color: #fff;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600;
    padding: 4px 10px; border-radius: 999px; backdrop-filter: blur(8px);
  }
  .gallery-thumbs {
    display: flex; gap: 8px; padding: 12px;
    background: #fff; border-top: 1px solid var(--cs-line);
  }
  .gallery-thumbs .thumb {
    width: 64px; height: 64px; border-radius: 10px; cursor: pointer;
    border: 2px solid transparent;
    background: linear-gradient(135deg, var(--c1), var(--c2));
    transition: all 160ms var(--cs-ease);
  }
  .gallery-thumbs .thumb.active { border-color: var(--cs-primary); transform: scale(0.98); }
  .gallery-thumbs .thumb:hover { transform: translateY(-1px); }

  /* Material cover */
  .material-cover {
    aspect-ratio: 16/9;
    background: linear-gradient(135deg, #dcfce7 0%, #16a34a 100%);
    position: relative; overflow: hidden;
    padding: 36px; display: flex; align-items: flex-end; color: #fff;
  }
  .material-cover::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(circle at 80% 20%, rgba(255,255,255,0.25) 0%, transparent 50%),
      radial-gradient(circle at 20% 90%, rgba(0,0,0,0.15) 0%, transparent 50%);
  }
  .material-cover .doc-icon {
    position: absolute; top: 32px; right: 32px;
    width: 64px; height: 64px; border-radius: 16px;
    background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
    display: grid; place-items: center; color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .material-cover .doc-icon .material-symbols-outlined { font-size: 32px; font-variation-settings: 'FILL' 1; }
  .material-cover .meta-tag {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; background: rgba(0,0,0,0.25); border-radius: 999px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    color: rgba(255,255,255,0.9); backdrop-filter: blur(8px); z-index: 1;
  }
  .material-cover .toc-preview {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; gap: 6px;
    font-size: 13px; color: rgba(255,255,255,0.95); margin-top: 8px;
  }
  .material-cover .toc-preview span { display: inline-flex; align-items: center; gap: 8px; }
  .material-cover .toc-preview .material-symbols-outlined { font-size: 14px; opacity: 0.7; }

  /* Recruitment banner */
  .recruit-banner {
    padding: 40px 36px;
    background: linear-gradient(135deg, #0b3553 0%, #1d4ed8 100%);
    color: #fff; position: relative; overflow: hidden;
  }
  .recruit-banner::before {
    content: ''; position: absolute; right: -80px; top: -80px;
    width: 280px; height: 280px;
    background: radial-gradient(circle, rgba(255,208,137,0.25) 0%, transparent 70%);
    pointer-events: none;
  }
  .recruit-banner > * { position: relative; z-index: 1; }
  .recruit-banner .type-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 12px 5px 10px;
    background: rgba(255,255,255,0.18); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.25); border-radius: 999px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .recruit-banner .type-pill .material-symbols-outlined { font-size: 13px; }

  /* title block */
  .title-block { padding: 0; }
  .title-row {
    display: flex; align-items: flex-start;
    justify-content: space-between; gap: 16px; margin-bottom: 10px;
  }
  .title-row .status-pill {
    flex-shrink: 0; font-size: 11px; font-weight: 800; letter-spacing: 0.08em;
    padding: 4px 10px; border-radius: 999px; text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .title-row .status-pill .dot { width: 5px; height: 5px; border-radius: 999px; background: currentColor; }
  .title-row .status-pill.open { background: var(--green-soft); color: var(--green); }
  .title-row .status-pill.few { background: var(--amber-soft); color: var(--amber); }
  .h1 {
    margin: 0; font-family: 'Manrope', sans-serif; font-weight: 800;
    font-size: clamp(24px, 2.6vw, 32px); line-height: 1.2;
    letter-spacing: -0.02em; color: var(--cs-ink);
  }
  .meta-row {
    margin-top: 12px; display: flex; flex-wrap: wrap; align-items: center;
    gap: 18px; font-size: 13px; color: var(--cs-muted);
  }
  .meta-row > span { display: inline-flex; align-items: center; gap: 5px; }
  .meta-row .material-symbols-outlined { font-size: 15px; color: var(--cs-muted-2); }
  .meta-row .dot { width: 3px; height: 3px; border-radius: 999px; background: var(--cs-muted-2); }

  .tags-row { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  .tag-chip {
    padding: 5px 12px; border-radius: 999px;
    background: var(--cs-primary-soft); color: var(--cs-primary);
    font-size: 12.5px; font-weight: 600;
  }

  /* section */
  .section {
    background: #fff; border: 1px solid var(--cs-line);
    border-radius: var(--cs-r-xl); padding: 28px 32px;
    box-shadow: var(--cs-shadow-sm);
  }
  .section h2 {
    margin: 0 0 18px; font-family: 'Manrope', sans-serif;
    font-size: 18px; font-weight: 800; color: var(--cs-ink);
    letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px;
  }
  .section h2 .material-symbols-outlined { font-size: 18px; color: var(--cs-primary); }

  .body-text { font-size: 15px; line-height: 1.75; color: var(--cs-ink-soft); white-space: pre-line; }
  .body-text p { margin: 0 0 14px; }
  .body-text p:last-child { margin: 0; }

  .specs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
  .spec-cell { padding: 14px 16px; border-radius: var(--cs-r-md); background: rgba(0,0,0,0.025); }
  .spec-cell .l {
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--cs-muted);
  }
  .spec-cell .v {
    margin-top: 5px; font-family: 'Manrope', sans-serif;
    font-size: 14px; font-weight: 700; color: var(--cs-ink);
    display: flex; align-items: center; gap: 6px;
  }

  /* Roles */
  .roles-list { display: flex; flex-direction: column; gap: 12px; }
  .role-card {
    padding: 14px 16px; border-radius: var(--cs-r-md); background: rgba(0,0,0,0.025);
    display: grid; grid-template-columns: 40px 1fr auto; gap: 14px; align-items: center;
  }
  .role-card .icn {
    width: 40px; height: 40px; border-radius: 11px;
    background: var(--cs-primary-soft); color: var(--cs-primary);
    display: grid; place-items: center;
  }
  .role-card .icn .material-symbols-outlined { font-size: 20px; font-variation-settings: 'FILL' 1; }
  .role-card .info { min-width: 0; }
  .role-card .name { font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 14.5px; color: var(--cs-ink); }
  .role-card .req { margin-top: 3px; font-size: 12.5px; color: var(--cs-muted); }
  .role-card .slots {
    font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700;
    color: var(--cs-muted); background: rgba(0,0,0,0.06); padding: 4px 10px;
    border-radius: 999px; white-space: nowrap;
  }
  .role-card .slots .num { color: var(--cs-primary); font-size: 14px; margin-right: 2px; }

  /* Timeline */
  .timeline { position: relative; padding-left: 20px; }
  .timeline::before {
    content: ''; position: absolute; left: 6px; top: 12px; bottom: 12px;
    width: 2px; background: var(--cs-line); border-radius: 999px;
  }
  .timeline-row { position: relative; padding: 6px 0 14px; }
  .timeline-row::before {
    content: ''; position: absolute; left: -19px; top: 12px;
    width: 12px; height: 12px; border-radius: 999px;
    background: var(--cs-primary); border: 2px solid #fff;
    box-shadow: 0 0 0 2px var(--cs-primary-soft);
  }
  .timeline-row.done::before { background: var(--cs-muted-2); box-shadow: 0 0 0 2px rgba(0,0,0,0.04); }
  .timeline-row .t-date { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--cs-primary); font-weight: 700; }
  .timeline-row.done .t-date { color: var(--cs-muted-2); }
  .timeline-row .t-text { margin-top: 3px; font-size: 14px; color: var(--cs-ink); font-weight: 600; }
  .timeline-row .t-sub { margin-top: 3px; font-size: 12.5px; color: var(--cs-muted); }

  /* Comments */
  .comment-input { display: flex; gap: 12px; margin-bottom: 24px; }
  .comment-input .av {
    width: 36px; height: 36px; border-radius: 999px;
    background: linear-gradient(135deg, #ffd089, #f0a35a);
    color: #fff; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 14px;
    display: grid; place-items: center; flex-shrink: 0;
  }
  .comment-input-wrap {
    flex: 1; border: 1px solid var(--cs-line); border-radius: var(--cs-r-md);
    background: rgba(0,0,0,0.02); padding: 12px 14px;
    transition: all 200ms var(--cs-ease);
  }
  .comment-input-wrap:focus-within { border-color: var(--cs-primary); box-shadow: var(--cs-shadow-focus); background: #fff; }
  .comment-input-wrap textarea {
    width: 100%; border: none; outline: none; background: transparent;
    font-family: inherit; font-size: 14px; resize: none; color: var(--cs-ink); min-height: 22px;
  }
  .comment-input-actions { margin-top: 8px; display: flex; align-items: center; justify-content: space-between; }
  .comment-input-actions .hint { font-size: 11.5px; color: var(--cs-muted); }
  .comment-input-actions button {
    height: 32px; padding: 0 14px; border-radius: 999px; border: none;
    background: var(--cs-primary); color: #fff;
    font-family: inherit; font-weight: 700; font-size: 12.5px; cursor: pointer;
  }
  .comment-input-actions button:hover { background: var(--cs-primary-strong); }

  .comment { display: flex; gap: 12px; padding: 16px 0; border-top: 1px solid var(--cs-line); }
  .comment:first-of-type { border-top: none; padding-top: 0; }
  .comment .av {
    width: 36px; height: 36px; border-radius: 999px; color: #fff;
    font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 14px;
    display: grid; place-items: center; flex-shrink: 0;
  }
  .comment-body { flex: 1; min-width: 0; }
  .comment-head { display: flex; align-items: center; gap: 8px; }
  .comment-head .name { font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 13.5px; color: var(--cs-ink); }
  .comment-head .when { font-size: 11.5px; color: var(--cs-muted-2); font-family: 'JetBrains Mono', monospace; }

  .comment-actions { margin-top: 8px; display: flex; gap: 16px; font-size: 12px; color: var(--cs-muted); }
  .comment-actions button {

  .side { position: sticky; top: 88px; display: flex; flex-direction: column; gap: 16px; }

  .cta-row { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
  .cta-primary {

  .cta-secondary-row { display: flex; gap: 8px; }

  .trust-strip {

  .trust-cell .ic {

  .trust-cell .ic .material-symbols-outlined { font-size: 16px; font-variation-settings: 'FILL' 1; }
  .trust-cell .l { font-size: 11px; color: var(--cs-muted); font-weight: 600; }

  .author-card { padding: 20px 24px; }
  .author-head { display: flex; align-items: center; gap: 12px; }
  .author-avatar {

  .author-head .info { flex: 1; min-width: 0; }
  .author-head .name {
    font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 15px;

  }
  .author-head .name .material-symbols-outlined { font-size: 14px; color: var(--green); font-variation-settings: 'FILL' 1; }
  .author-head .sub { margin-top: 3px; font-size: 12.5px; color: var(--cs-muted); }
  .author-stats {
    margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--cs-line);

  }
  .author-stat { text-align: center; }
  .author-stat:not(:last-child) { border-right: 1px solid var(--cs-line); }
  .author-stat .v { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 17px; color: var(--cs-ink); letter-spacing: -0.01em; }
  .author-stat .l { margin-top: 4px; font-size: 11px; color: var(--cs-muted); }

  .countdown-card {
    padding: 20px 24px;
    background: linear-gradient(135deg, #fff7ed, #ffedd5);
    border-color: rgba(180, 83, 9, 0.2);

  .countdown-card .l {
    font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--amber); display: inline-flex; align-items: center; gap: 5px;

  .countdown-card .l .material-symbols-outlined { font-size: 13px; }
  .countdown-card .num { margin-top: 10px; display: flex; align-items: baseline; gap: 14px; }
  .countdown-card .num .cell { display: flex; flex-direction: column; align-items: center; }
  .countdown-card .num .cell .n {
    font-family: 'Manrope', sans-serif; font-weight: 900; font-size: 32px;
    line-height: 1; letter-spacing: -0.02em; color: var(--cs-ink);
  }
  .countdown-card .num .cell .ut {
    margin-top: 4px; font-size: 10.5px; color: var(--cs-muted);
    font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .countdown-progress {
    margin-top: 14px; height: 6px; border-radius: 999px;
    background: rgba(180, 83, 9, 0.18); overflow: hidden;
  }
  .countdown-progress .fill { height: 100%; background: var(--amber); border-radius: 999px; }
  .countdown-spots { margin-top: 8px; font-size: 12px; color: var(--cs-muted); }
  .countdown-spots strong { color: var(--amber); font-weight: 800; }

  /* footer */
  footer {
    max-width: 1280px; margin: 28px auto 0;
    padding: 20px clamp(16px, 3vw, 32px) 32px;
    border-top: 1px solid var(--cs-line);

    justify-content: space-between; gap: 16px;
    font-size: 12px; color: var(--cs-muted);

  footer .links { display: flex; gap: 18px; }
  footer a { color: var(--cs-muted); text-decoration: none; cursor: pointer; }
  footer a:hover { color: var(--cs-primary); }

  .report-row {
    margin-top: 14px; display: flex; justify-content: flex-end;
    align-items: center; gap: 16px;
    font-size: 11.5px; color: var(--cs-muted-2);
  }
  .report-row button {
    background: none; border: none; cursor: pointer; color: var(--cs-muted-2);
    font-family: inherit; font-size: 11.5px;
    display: inline-flex; align-items: center; gap: 4px; padding: 0;
  }
  .report-row button:hover { color: var(--rose); }
  .report-row button .material-symbols-outlined { font-size: 13px; }

  .twk-fab { z-index: 60 !important; }
</style>
