<!DOCTYPE html>
<html class="light" lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>我的发布 | CampusShare</title>
<script src="/pages/assets/vendor/tailwindcss.js"></script>
<link href="/pages/assets/fonts/campusshare-fonts.css" rel="stylesheet"/>
<link href="/pages/assets/fonts/material-symbols.css" rel="stylesheet"/>
<link href="/pages/assets/css/campusshare-modern.css" rel="stylesheet"/>
<script id="tailwind-config">
tailwind.config = {
    darkMode: "class",
    theme: {
        extend: {
            colors: {
                primary: "#005d90",
                "primary-strong": "#004b74",
                "primary-soft": "#eef6fb",
                surface: "#f5f5f7",
                card: "#ffffff",
                line: "rgba(120,133,150,0.16)",
                muted: "#64748b",
                ink: "#172033",
                tertiary: "#3454d1",
                error: "#b42318",
                success: "#0a8a4f",
                /* MD compat — JS sets these class names in rendered HTML */
                "surface-container-lowest": "#ffffff",
                "surface-container-low": "#f3f4f5",
                "surface-container": "#edeeef",
                "surface-container-high": "#e7e8e9",
                "surface-container-highest": "#e1e3e4",
                "on-primary": "#ffffff",
                "on-surface": "#191c1d",
                "on-surface-variant": "#404850",
                "primary-container": "#0077b6",
                "on-primary-container": "#f3f7ff",
                "secondary-container": "#69e5ff",
                "on-secondary-container": "#006575",
                "on-error": "#ffffff",
                "outline": "#707881",
                "outline-variant": "#bfc7d1"
            },
            borderRadius: { DEFAULT: "8px", md: "10px", lg: "12px", xl: "16px", full: "999px" },
            fontFamily: {
                headline: ["Manrope", "Noto Sans SC", "Microsoft YaHei", "sans-serif"],
                body: ["Inter", "Noto Sans SC", "Microsoft YaHei", "sans-serif"]
            }
        }
    }
};
</script>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--cs-font-body);
        background: var(--cs-surface);
        color: var(--cs-ink);
        text-wrap: pretty;
    }
    h1, h2, h3 { font-family: var(--cs-font-headline); letter-spacing: 0; }
    .material-symbols-outlined {
        line-height: 1;
        font-variation-settings: "FILL" 0, "wght" 430, "GRAD" 0, "opsz" 24;
    }

    /* Embedded mode */
    [data-user-topbar], [data-user-sidebar], footer { display: none; }
    body:not(.campusshare-embedded-page) [data-user-main] { margin-left: 16.75rem; }
    .campusshare-embedded-page [data-user-main] {
        margin-left: 0 !important;
        padding: 1.5rem !important;
    }

    /* Search input */
    .publish-search-input {
        height: 38px;
        padding: 0 10px 0 36px;
        border: 1px solid var(--cs-line);
        border-radius: var(--cs-radius-sm);
        font-size: 13px;
        background: var(--cs-card);
        color: var(--cs-ink);
        outline: none;
        width: 100%;
        transition: border-color 180ms var(--cs-ease), box-shadow 180ms var(--cs-ease);
    }
    .publish-search-input::placeholder { color: var(--cs-muted); }
    .publish-search-input:focus {
        border-color: var(--cs-primary);
        box-shadow: var(--cs-shadow-focus);
    }

    /* Status select */
    .publish-status-select {
        height: 38px;
        padding: 0 10px;
        border: 1px solid var(--cs-line);
        border-radius: var(--cs-radius-sm);
        font-size: 13px;
        background: var(--cs-card);
        color: var(--cs-ink);
        outline: none;
        cursor: pointer;
        white-space: nowrap;
    }
</style>
</head>
<body>
<header data-user-topbar></header>
<div class="flex min-h-screen" data-user-shell>
<aside data-user-sidebar></aside>
<main class="flex-1 p-8" data-user-main>
<div class="mx-auto max-w-6xl">

    <!-- Page header -->
    <div class="cs-page-header mb-6">
        <div>
            <h1 class="cs-h1">我的发布</h1>
            <p class="cs-caption mt-1">管理你的商品和学术资料发布内容</p>
        </div>
        <button class="cs-btn cs-btn--primary" data-nav-target="/pages/publish_center.html" type="button">
            <span class="material-symbols-outlined" style="font-size:18px;">add</span>
            发布
        </button>
    </div>

    <!-- Stats cards
         JS: div.grid.grid-cols-1.md:grid-cols-3 > div, p.text-3xl (value), p.text-xs (helper) -->
    <div class="mb-8 grid grid-cols-1 gap-4 md:grid-cols-3">
        <div class="cs-stat-card">
            <p class="cs-caption mb-1">正在出售</p>
            <p class="text-3xl font-bold font-headline" style="color:var(--cs-primary);">…</p>
            <p class="text-xs mt-1" style="color:var(--cs-muted);">正在同步</p>
        </div>
        <div class="cs-stat-card">
            <p class="cs-caption mb-1">已售出/完成</p>
            <p class="text-3xl font-bold font-headline" style="color:var(--cs-success);">…</p>
            <p class="text-xs mt-1" style="color:var(--cs-muted);">正在同步</p>
        </div>
        <div class="cs-stat-card">
            <p class="cs-caption mb-1">共享资料</p>
            <p class="text-3xl font-bold font-headline" style="color:var(--cs-tertiary);">…</p>
            <p class="text-xs mt-1" style="color:var(--cs-muted);">正在同步</p>
        </div>
    </div>

    <!-- Tabs & Filters bar -->
    <div class="mb-6 overflow-hidden rounded-xl"
         style="background:var(--cs-card);border:1px solid var(--cs-line);box-shadow:var(--cs-shadow-sm);">
        <div class="flex flex-col gap-3 px-4 py-3 sm:flex-row sm:items-center sm:justify-between">

            <!-- Tab buttons
                 JS: div.flex.bg-surface.rounded-lg.p-1 > button
                 JS adds/removes: bg-primary-container text-on-primary-container font-semibold / text-on-surface-variant font-medium -->
            <div class="flex bg-surface rounded-lg p-1" style="gap:2px;">
                <button class="px-5 py-1.5 rounded-md bg-primary-container text-on-primary-container font-semibold text-sm transition-all" type="button">已发布商品</button>
                <button class="px-5 py-1.5 rounded-md text-on-surface-variant font-medium text-sm transition-all" type="button">共享资料</button>
            </div>

            <!-- Search + status filter
                 JS: div.flex.items-center.gap-4 select
                 JS: div.relative input -->
            <div class="flex items-center gap-4">
                <div class="relative" style="width:200px;">
                    <span class="material-symbols-outlined absolute left-2.5 top-1/2 -translate-y-1/2 pointer-events-none"
                          style="font-size:18px;color:var(--cs-muted);">search</span>
                    <input class="publish-search-input" placeholder="搜索我的发布..." type="text"/>
                </div>
                <select class="publish-status-select">
                    <option>全部状态</option>
                    <option>上架中</option>
                    <option>已下架</option>
                </select>
            </div>

        </div>
    </div>

    <!-- Content list
         JS: div.space-y-4 (list container) -->
    <div class="space-y-4">
        <div class="rounded-xl p-10 text-center"
             style="background:var(--cs-card);border:1px solid var(--cs-line);">
            <span class="material-symbols-outlined" style="font-size:40px;color:var(--cs-primary);opacity:0.35;">sync</span>
            <p class="mt-3 text-sm font-medium" style="color:var(--cs-muted);">正在加载发布内容</p>
            <p class="mt-1 text-xs" style="color:var(--cs-muted);">正在读取你的商品与资料发布记录</p>
        </div>
    </div>

    <!-- Pagination
         JS: div.mt-12.flex.justify-between.items-center (container)
         JS: span (summary text), div (button group) -->
    <div class="mt-12 flex justify-between items-center rounded-xl px-5 py-3"
         style="background:var(--cs-card);border:1px solid var(--cs-line);">
        <span class="text-sm" style="color:var(--cs-muted);">等待数据同步</span>
        <div class="flex items-center gap-1"></div>
    </div>

</div>
</main>
</div>
<footer></footer>
<script src="/pages/assets/js/campusshare-api.js?v=20260515"></script>
<script src="/pages/assets/js/my-publish.js?v=20260504-secure-material-download"></script>
</body>
</html>
