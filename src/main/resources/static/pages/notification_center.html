<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CampusShare - 消息中心</title>
<script src="/pages/assets/vendor/tailwindcss.js"></script>
<link href="/pages/assets/fonts/campusshare-fonts.css" rel="stylesheet"/>
<link href="/pages/assets/fonts/material-symbols.css" rel="stylesheet"/>
<script id="tailwind-config">
tailwind.config={darkMode:"class",theme:{extend:{colors:{primary:"#005d90","primary-container":"#0077b6","on-primary":"#fff",surface:"#f5f5f7","surface-container":"#edf1f5","surface-container-low":"#f5f5f7","surface-container-lowest":"#fff",outline:"#6b7582","outline-variant":"#c8d0da","on-surface":"#172033","on-surface-variant":"#566273"},borderRadius:{DEFAULT:"8px",lg:"10px",xl:"16px",full:"999px"},fontFamily:{headline:["Manrope","Noto Sans SC","Microsoft YaHei","sans-serif"],body:["Inter","Noto Sans SC","Microsoft YaHei","sans-serif"]}}}};
</script>
<style>
body{margin:0;min-height:100vh;font-family:"Inter","Noto Sans SC","Microsoft YaHei",sans-serif;background:#f5f5f7;color:#172033;text-wrap:pretty}h1,h2,h3{font-family:"Manrope","Noto Sans SC","Microsoft YaHei",sans-serif}.material-symbols-outlined{line-height:1;font-variation-settings:"FILL" 0,"wght" 430,"GRAD" 0,"opsz" 24}.glass{border:1px solid rgba(120,133,150,.18);background:rgba(255,255,255,.88);box-shadow:0 20px 52px rgba(15,23,42,.08);backdrop-filter:blur(18px)}[data-user-topbar],[data-user-sidebar],footer{display:none}.campusshare-embedded-page main{margin-left:0!important;padding:1.5rem!important}.campusshare-embedded-page .max-w-6xl{max-width:none!important}
</style>
</head>
<body class="min-h-screen bg-surface text-on-surface">
<header data-user-topbar></header>
<div class="flex" data-user-shell>
<aside data-user-sidebar></aside>
<main class="min-h-screen flex-1 bg-surface p-8" data-user-main>
    <div class="mx-auto max-w-6xl">
        <section class="glass mb-6 overflow-hidden rounded-2xl">
            <div class="flex flex-col gap-6 p-6 lg:flex-row lg:items-center lg:justify-between">
                <div class="flex items-center gap-4">
                    <div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl bg-[#eef6fb] text-primary">
                        <span class="material-symbols-outlined text-3xl">notifications_active</span>
                    </div>
                    <div>
                        <p class="text-xs font-extrabold uppercase tracking-[0.18em] text-slate-400">Notification Center</p>
                        <h1 class="mt-1 text-3xl font-extrabold text-slate-950">消息中心</h1>
                        <p class="mt-1 text-sm text-slate-500">集中处理订单、审核、积分和组队相关提醒。</p>
                    </div>
                </div>
                <button class="inline-flex items-center justify-center gap-2 rounded-full bg-primary px-4 py-2.5 text-sm font-bold text-on-primary shadow-sm transition hover:bg-primary-container disabled:cursor-not-allowed disabled:bg-slate-300" type="button" data-notification-mark-all>
                    <span class="material-symbols-outlined text-lg" data-icon="done_all">done_all</span>
                    全部标记为已读
                </button>
            </div>
            <div class="grid grid-cols-1 border-t border-[rgba(120,133,150,.16)] md:grid-cols-3">
                <div class="px-6 py-4"><p class="text-xs font-bold uppercase tracking-widest text-slate-400">全部消息</p><p class="mt-1 text-2xl font-extrabold" data-notification-total>0</p></div>
                <div class="border-y border-[rgba(120,133,150,.16)] px-6 py-4 md:border-x md:border-y-0"><p class="text-xs font-bold uppercase tracking-widest text-slate-400">未读消息</p><p class="mt-1 text-2xl font-extrabold text-primary" data-notification-unread>0</p></div>
                <div class="px-6 py-4"><p class="text-xs font-bold uppercase tracking-widest text-slate-400">已读消息</p><p class="mt-1 text-2xl font-extrabold text-slate-500" data-notification-read>0</p></div>
            </div>
        </section>
        <div class="mb-5 flex flex-col gap-3 rounded-2xl border border-[rgba(120,133,150,.18)] bg-white p-3 shadow-sm sm:flex-row sm:items-center sm:justify-between">
            <div class="flex w-full items-center rounded-full bg-slate-100 p-1 sm:w-auto">
                <button class="flex-1 rounded-full bg-white px-5 py-2 text-sm font-bold text-primary shadow-sm sm:flex-none" type="button" data-notification-filter="ALL">全部消息</button>
                <button class="flex-1 rounded-full px-5 py-2 text-sm font-semibold text-slate-500 transition hover:text-primary sm:flex-none" type="button" data-notification-filter="UNREAD">未读</button>
                <button class="flex-1 rounded-full px-5 py-2 text-sm font-semibold text-slate-500 transition hover:text-primary sm:flex-none" type="button" data-notification-filter="READ">已读</button>
            </div>
            <div class="flex items-center gap-2 text-xs font-medium text-slate-400"><span class="material-symbols-outlined text-base">update</span><span>按发送时间倒序排列</span></div>
        </div>
        <div class="space-y-4" data-notification-list>
            <div class="rounded-2xl border border-[rgba(120,133,150,.18)] bg-white p-8 text-center text-sm text-slate-500 shadow-sm">正在加载消息...</div>
        </div>
    </div>
</main>
</div>
<script src="/pages/assets/js/campusshare-api.js?v=20260510-mojibake"></script>
<script src="/pages/assets/js/notification-center.js?v=20260511-clean"></script>
</body>
</html>
