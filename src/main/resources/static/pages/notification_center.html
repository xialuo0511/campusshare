<!DOCTYPE html>
<html class="light" lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>消息中心 | CampusShare</title>
<script src="/pages/assets/vendor/tailwindcss.js"></script>
<link href="/pages/assets/fonts/campusshare-fonts.css" rel="stylesheet"/>
<link href="/pages/assets/fonts/material-symbols.css" rel="stylesheet"/>
<link href="/pages/assets/css/campusshare-modern.css" rel="stylesheet"/>
<script id="tailwind-config">
tailwind.config = {
    darkMode: "class",
    theme: {
        extend: {
            colors: {
                primary: "#005d90",
                "primary-strong": "#004b74",
                "primary-soft": "#eef6fb",
                surface: "#f5f5f7",
                card: "#ffffff",
                line: "rgba(120,133,150,0.16)",
                muted: "#64748b",
                ink: "#172033",
                error: "#b42318",
                /* MD compat — JS adds/removes these class names on filter buttons & rendered HTML */
                "surface-container-lowest": "#ffffff",
                "surface-container": "#edeeef",
                "on-primary": "#ffffff",
                "on-surface": "#191c1d",
                "on-surface-variant": "#404850",
                "primary-container": "#0077b6",
                "outline": "#707881",
                "outline-variant": "#bfc7d1"
            },
            borderRadius: { DEFAULT: "8px", md: "10px", lg: "12px", xl: "16px", full: "999px" },
            fontFamily: {
                headline: ["Manrope", "Noto Sans SC", "Microsoft YaHei", "sans-serif"],
                body: ["Inter", "Noto Sans SC", "Microsoft YaHei", "sans-serif"]
            }
        }
    }
};
</script>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--cs-font-body);
        background: var(--cs-surface);
        color: var(--cs-ink);
        text-wrap: pretty;
    }
    h1, h2, h3 { font-family: var(--cs-font-headline); letter-spacing: 0; }
    .material-symbols-outlined {
        line-height: 1;
        font-variation-settings: "FILL" 0, "wght" 430, "GRAD" 0, "opsz" 24;
    }

    /* Embedded mode */
    [data-user-topbar], [data-user-sidebar], footer { display: none; }
    body:not(.campusshare-embedded-page) [data-user-main] { margin-left: 16.75rem; }
    .campusshare-embedded-page [data-user-main] {
        margin-left: 0 !important;
        padding: 1.5rem !important;
    }
    .campusshare-embedded-page .max-w-6xl { max-width: none !important; }
</style>
</head>
<body>
<header data-user-topbar></header>
<div class="flex" data-user-shell>
<aside data-user-sidebar></aside>
<main class="min-h-screen flex-1 p-8" data-user-main>
<div class="mx-auto max-w-6xl">

    <!-- Page header card -->
    <section class="mb-6 overflow-hidden rounded-xl"
             style="background:var(--cs-card);border:1px solid var(--cs-line);box-shadow:var(--cs-shadow-sm);">
        <div class="flex flex-col gap-5 p-6 lg:flex-row lg:items-center lg:justify-between">
            <div class="flex items-center gap-4">
                <div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-xl"
                     style="background:var(--cs-primary-soft);color:var(--cs-primary);">
                    <span class="material-symbols-outlined" style="font-size:28px;">notifications_active</span>
                </div>
                <div>
                    <p class="cs-micro mb-0.5">Notification Center</p>
                    <h1 class="cs-h2">消息中心</h1>
                    <p class="cs-caption mt-0.5">集中处理订单、审核和组队相关提醒</p>
                </div>
            </div>
            <button class="cs-btn cs-btn--primary" data-notification-mark-all type="button">
                <span class="material-symbols-outlined" style="font-size:18px;">done_all</span>
                全部标记为已读
            </button>
        </div>

        <!-- Stats row -->
        <div class="grid grid-cols-3 border-t" style="border-color:var(--cs-line);">
            <div class="px-6 py-4">
                <p class="cs-micro">全部消息</p>
                <p class="text-2xl font-bold font-headline mt-1" data-notification-total>0</p>
            </div>
            <div class="px-6 py-4 border-x" style="border-color:var(--cs-line);">
                <p class="cs-micro">未读消息</p>
                <p class="text-2xl font-bold font-headline mt-1" style="color:var(--cs-primary);" data-notification-unread>0</p>
            </div>
            <div class="px-6 py-4">
                <p class="cs-micro">已读消息</p>
                <p class="text-2xl font-bold font-headline mt-1" style="color:var(--cs-muted);" data-notification-read>0</p>
            </div>
        </div>
    </section>

    <!-- Filter tabs bar
         JS: UpdateFilterButtonStyle adds bg-surface-container-lowest text-primary shadow-sm font-bold / text-on-surface-variant -->
    <div class="mb-5 flex flex-col gap-3 rounded-xl p-3 sm:flex-row sm:items-center sm:justify-between"
         style="background:var(--cs-card);border:1px solid var(--cs-line);box-shadow:var(--cs-shadow-sm);">
        <div class="flex items-center rounded-full p-1" style="background:rgba(120,133,150,0.08);">
            <button class="flex-1 rounded-full bg-surface-container-lowest px-5 py-2 text-sm font-bold text-primary shadow-sm transition sm:flex-none"
                    data-notification-filter="ALL" type="button">全部消息</button>
            <button class="flex-1 rounded-full px-5 py-2 text-sm font-semibold text-on-surface-variant transition sm:flex-none"
                    data-notification-filter="UNREAD" type="button">未读</button>
            <button class="flex-1 rounded-full px-5 py-2 text-sm font-semibold text-on-surface-variant transition sm:flex-none"
                    data-notification-filter="READ" type="button">已读</button>
        </div>
        <div class="flex items-center gap-2 text-xs" style="color:var(--cs-muted);">
            <span class="material-symbols-outlined" style="font-size:16px;">update</span>
            <span>按发送时间倒序排列</span>
        </div>
    </div>

    <!-- Notification list -->
    <div class="space-y-4" data-notification-list>
        <div class="rounded-xl p-8 text-center text-sm"
             style="background:var(--cs-card);border:1px solid var(--cs-line);color:var(--cs-muted);">
            正在加载消息...
        </div>
    </div>

</div>
</main>
</div>
<footer></footer>
<script src="/pages/assets/js/campusshare-api.js?v=20260515"></script>
<script src="/pages/assets/js/notification-center.js?v=20260515"></script>
</body>
</html>
