<!DOCTYPE html>
<html class="light" lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CampusShare 订单中心</title>
<script src="/pages/assets/vendor/tailwindcss.js"></script>
<link href="/pages/assets/fonts/campusshare-fonts.css" rel="stylesheet"/>
<link href="/pages/assets/fonts/material-symbols.css" rel="stylesheet"/>
<script id="tailwind-config">
tailwind.config={darkMode:"class",theme:{extend:{colors:{primary:"#005d90","primary-container":"#0077b6","on-primary":"#fff",surface:"#f5f5f7","surface-container-low":"#f5f5f7","surface-container":"#edf1f5","surface-container-lowest":"#fff",outline:"#6b7582","outline-variant":"#c8d0da","on-surface":"#172033","on-surface-variant":"#566273",secondary:"#006878",tertiary:"#3454d1",error:"#b42318"},borderRadius:{DEFAULT:"8px",lg:"10px",xl:"16px",full:"999px"},fontFamily:{headline:["Manrope","Noto Sans SC","Microsoft YaHei","sans-serif"],body:["Inter","Noto Sans SC","Microsoft YaHei","sans-serif"]}}}};
</script>
<style>
body{margin:0;min-height:100vh;font-family:"Inter","Noto Sans SC","Microsoft YaHei",sans-serif;background:#f5f5f7;color:#172033;text-wrap:pretty}h1,h2,h3{font-family:"Manrope","Noto Sans SC","Microsoft YaHei",sans-serif}.material-symbols-outlined{line-height:1;font-variation-settings:"FILL" 0,"wght" 430,"GRAD" 0,"opsz" 24}.glass{border:1px solid rgba(120,133,150,.18);background:rgba(255,255,255,.88);box-shadow:0 20px 52px rgba(15,23,42,.08);backdrop-filter:blur(18px)}[data-user-topbar],[data-user-sidebar],footer{display:none}body:not(.campusshare-embedded-page) [data-user-main]{margin-left:16rem}.campusshare-embedded-page [data-user-main]{margin-left:0!important;padding:1.5rem!important;max-width:none!important}.campusshare-embedded-page .max-w-6xl{max-width:none!important}
</style>
</head>
<body class="text-on-surface">
<header data-user-topbar></header>
<div class="flex min-h-screen" data-user-shell>
<aside data-user-sidebar></aside>
<main class="flex-1 bg-surface-container-low p-8" data-user-main>
<div class="mx-auto max-w-6xl">
    <header class="mb-8">
        <h1 class="text-3xl font-extrabold text-slate-950">订单中心</h1>
        <p class="mt-1 text-sm text-slate-500">管理你的校园交易订单和状态流转。</p>
    </header>
    <div class="mb-8 grid grid-cols-1 gap-4 md:grid-cols-4">
        <div class="glass rounded-2xl p-6"><p class="mb-2 text-xs font-bold uppercase tracking-[0.16em] text-slate-400">总订单</p><p class="text-3xl font-extrabold text-primary" data-role="order-summary-total">0</p><div class="mt-2 text-xs text-slate-500">全部订单数量</div></div>
        <div class="glass rounded-2xl p-6"><p class="mb-2 text-xs font-bold uppercase tracking-[0.16em] text-slate-400">进行中交易</p><p class="text-3xl font-extrabold text-secondary" data-role="order-summary-ongoing">0</p><div class="mt-2 text-xs text-slate-500">需要继续处理</div></div>
        <div class="glass rounded-2xl p-6"><p class="mb-2 text-xs font-bold uppercase tracking-[0.16em] text-slate-400">已完成</p><p class="text-3xl font-extrabold text-tertiary" data-role="order-summary-completed">0</p><div class="mt-2 text-xs text-slate-500">成功交付订单</div></div>
        <div class="glass rounded-2xl p-6"><p class="mb-2 text-xs font-bold uppercase tracking-[0.16em] text-slate-400">处理时间</p><p class="text-3xl font-extrabold text-slate-950" data-role="order-summary-point">0</p><div class="mt-2 text-xs text-slate-500">平均处理指标</div></div>
    </div>
    <section class="glass mb-8 rounded-2xl p-8" data-role="order-tracking-section">
        <div class="py-6 text-center text-sm text-slate-500">暂无可追踪订单</div>
    </section>
    <div class="overflow-hidden rounded-xl rounded-2xl bg-white shadow-sm bg-surface-container-lowest">
        <div class="flex items-center justify-between border-b border-[rgba(120,133,150,.16)] bg-white px-6 py-4">
            <h3 class="font-extrabold text-slate-950">历史订单</h3>
            <div class="flex gap-2">
                <button class="rounded-lg bg-slate-100 px-3 py-1.5 text-xs font-bold text-slate-600">全部</button>
                <button class="rounded-lg px-3 py-1.5 text-xs font-bold text-slate-400 hover:bg-slate-100">待处理</button>
                <button class="rounded-lg px-3 py-1.5 text-xs font-bold text-slate-400 hover:bg-slate-100">已完成</button>
            </div>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full border-collapse text-left">
                <thead><tr class="bg-slate-50">
                    <th class="px-6 py-4 text-[10px] font-extrabold uppercase tracking-widest text-slate-400">订单号</th>
                    <th class="px-6 py-4 text-[10px] font-extrabold uppercase tracking-widest text-slate-400">商品/资源</th>
                    <th class="px-6 py-4 text-[10px] font-extrabold uppercase tracking-widest text-slate-400">卖家/买家</th>
                    <th class="px-6 py-4 text-[10px] font-extrabold uppercase tracking-widest text-slate-400">最后更新</th>
                    <th class="px-6 py-4 text-[10px] font-extrabold uppercase tracking-widest text-right text-slate-400">价格</th>
                    <th class="px-6 py-4 text-[10px] font-extrabold uppercase tracking-widest text-center text-slate-400">状态</th>
                    <th class="px-6 py-4"></th>
                </tr></thead>
                <tbody class="divide-y divide-surface-container"></tbody>
            </table>
        </div>
        <div class="bg-surface-container-low p-4 flex justify-between items-center px-6">
            <p class="text-xs text-slate-500">暂无订单</p>
            <div class="flex gap-1"></div>
        </div>
    </div>
</div>
</main>
</div>
<script src="/pages/assets/js/campusshare-api.js?v=20260510-mojibake"></script>
<script src="/pages/assets/js/order-center.js?v=20260511-clean"></script>
</body>
</html>
