<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CampusShare · 发布中心</title>

<link href="/pages/assets/fonts/campusshare-fonts.css" rel="stylesheet" />
<link href="/pages/assets/fonts/material-symbols.css" rel="stylesheet" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  :root {
    --cs-primary: #005d90;
    --cs-primary-strong: #004b74;
    --cs-primary-soft: #eef6fb;
    --cs-accent: #3454d1;
    --cs-ink: #0b1320;
    --cs-ink-soft: #172033;
    --cs-muted: #64748b;
    --cs-muted-2: #94a3b8;
    --cs-line: rgba(120, 133, 150, 0.18);
    --cs-line-strong: rgba(120, 133, 150, 0.32);
    --cs-card-bg: rgba(255, 255, 255, 0.78);
    --cs-card-solid: #ffffff;
    --cs-shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04), 0 6px 18px -8px rgba(15, 23, 42, 0.08);
    --cs-shadow-md: 0 14px 36px -16px rgba(8, 25, 53, 0.18);
    --cs-shadow-lg: 0 30px 60px -24px rgba(8, 25, 53, 0.22);
    --cs-shadow-focus: 0 0 0 4px rgba(0, 93, 144, 0.16);
    --cs-r-sm: 10px;
    --cs-r-md: 14px;
    --cs-r-lg: 18px;
    --cs-r-xl: 24px;
    --cs-ease: cubic-bezier(0.22, 1, 0.36, 1);
    --bg-base: #f4f6fa;

    --green: #0a8a4f;
    --green-soft: #e7f6ee;
    --amber: #b45309;
    --amber-soft: #fff4e0;
    --rose: #be123c;
    --rose-soft: #ffe4e9;
    --violet: #7c3aed;
    --violet-soft: #f1ebff;
    --blue: #1d6fe0;
    --blue-soft: #e8f0fb;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg-base);
    color: var(--cs-ink);
    font-family: 'Inter', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body {
    min-height: 100vh;
    background:
      radial-gradient(900px 480px at 8% -10%, rgba(0,93,144,0.10), transparent 60%),
      radial-gradient(900px 480px at 110% 0%, rgba(52,84,209,0.08), transparent 60%),
      linear-gradient(180deg, #ffffff 0%, #f4f6fa 320px);
    text-wrap: pretty;
    padding-bottom: 100px;
  }
  .material-symbols-outlined {
    font-family: 'Material Symbols Outlined';
    font-variation-settings: 'FILL' 0, 'wght' 430, 'GRAD' 0, 'opsz' 24;
    user-select: none; line-height: 1;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  /* ───────── Nav (same as workspace) ───────── */
  .nav {
    position: sticky; top: 0; z-index: 30;
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    background: rgba(255,255,255,0.78);
    border-bottom: 1px solid var(--cs-line);
  }
  .nav-inner {
    max-width: 1280px; margin: 0 auto;
    height: 64px;
    padding: 0 clamp(16px, 3vw, 32px);
    display: flex; align-items: center; gap: 20px;
  }
  .brand { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; flex-shrink: 0; }
  .brand .logo {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--cs-primary), var(--cs-accent));
    display: grid; place-items: center;
    color: #fff;
    box-shadow: 0 8px 20px -8px rgba(0,93,144,0.55), inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .brand .logo .material-symbols-outlined { font-size: 19px; font-variation-settings: 'FILL' 1; }
  .brand .name {
    font-family: 'Manrope', sans-serif;
    font-weight: 800; font-size: 19px;
    color: var(--cs-ink); letter-spacing: -0.01em;
  }
  .crumbs {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--cs-muted);
    margin-left: 8px; padding-left: 16px;
    border-left: 1px solid var(--cs-line);
    flex: 1; min-width: 0;
  }
  .crumbs a { color: var(--cs-muted); text-decoration: none; cursor: pointer; }
  .crumbs a:hover { color: var(--cs-primary); }
  .crumbs .here { color: var(--cs-ink); font-weight: 600; }
  .crumbs .material-symbols-outlined { font-size: 14px; color: var(--cs-muted-2); }

  .nav-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .ghost-btn {
    height: 36px; padding: 0 14px;
    border-radius: 999px;
    background: rgba(255,255,255,0.7);
    border: 1px solid var(--cs-line);
    font-family: inherit; font-size: 13px; font-weight: 600;
    color: var(--cs-ink-soft); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all 160ms var(--cs-ease);
  }
  .ghost-btn:hover { border-color: var(--cs-primary); color: var(--cs-primary); background: #fff; }
  .ghost-btn .material-symbols-outlined { font-size: 16px; }
  .primary-btn {
    height: 40px; padding: 0 20px 0 16px;
    border-radius: 999px; border: none;
    background: linear-gradient(135deg, var(--cs-primary), var(--cs-accent));
    color: #fff;
    font-family: 'Manrope', sans-serif;
    font-weight: 700; font-size: 14px;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    box-shadow: 0 10px 22px -10px rgba(0,93,144,0.55), inset 0 1px 0 rgba(255,255,255,0.22);
    transition: transform 140ms var(--cs-ease), box-shadow 220ms var(--cs-ease);
  }
  .primary-btn:hover { transform: translateY(-1px); box-shadow: 0 14px 28px -10px rgba(0,93,144,0.7); }
  .primary-btn .material-symbols-outlined { font-size: 17px; }
  .avatar-btn {
    width: 38px; height: 38px;
    border-radius: 999px;
    background: linear-gradient(135deg, #ffd089, #f0a35a);
    color: #fff;
    font-family: 'Manrope', sans-serif;
    font-weight: 700; font-size: 14px;
    display: grid; place-items: center; cursor: pointer;
    border: 2px solid #fff;
    box-shadow: var(--cs-shadow-sm);
  }

  /* ───────── Shell ───────── */
  .pub-shell {
    max-width: 1280px; margin: 0 auto;
    padding: clamp(20px, 3vw, 32px) clamp(16px, 3vw, 32px) 24px;
  }

  /* Hero w/ kind tabs */
  .pub-hero {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 28px;
    align-items: end;
    margin-bottom: 22px;
  }
  @media (max-width: 920px) {
    .pub-hero { grid-template-columns: 1fr; }
    .kind-tabs { grid-template-columns: repeat(3, 1fr) !important; }
  }
  .pub-eyebrow {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--cs-primary-soft);
    color: var(--cs-primary);
    font-size: 12px; font-weight: 700;
    padding: 5px 12px;
    border-radius: 999px;
    letter-spacing: 0.04em;
    margin-bottom: 10px;
  }
  .pub-eyebrow .material-symbols-outlined { font-size: 14px; }
  .pub-h1 {
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: clamp(30px, 4vw, 44px);
    color: var(--cs-ink);
    letter-spacing: -0.025em;
    line-height: 1.05;
    margin: 0;
  }
  .pub-h-sub {
    margin: 8px 0 0;
    font-size: 14px;
    color: var(--cs-muted);
    line-height: 1.55;
  }
  .kind-tabs {
    display: grid;
    grid-template-columns: repeat(3, 220px);
    gap: 10px;
  }
  .kind-tab {
    background: rgba(255,255,255,0.8);
    border: 1px solid var(--cs-line);
    border-radius: var(--cs-r-md);
    padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    transition: all 220ms var(--cs-ease);
    position: relative;
    overflow: hidden;
  }
  .kind-tab > .material-symbols-outlined {
    font-size: 26px;
    color: var(--cs-muted);
    transition: all 220ms var(--cs-ease);
    flex-shrink: 0;
  }
  .kind-tab > span:not(.kind-check):not(.material-symbols-outlined) {
    display: flex; flex-direction: column; min-width: 0;
  }
  .kind-tab b {
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: 15px;
    color: var(--cs-ink);
  }
  .kind-tab i {
    margin-top: 2px;
    font-style: normal;
    font-size: 11.5px;
    color: var(--cs-muted);
  }
  .kind-tab:hover {
    border-color: var(--cs-line-strong);
    box-shadow: var(--cs-shadow-sm);
    transform: translateY(-1px);
  }
  .kind-tab.on {
    background: linear-gradient(135deg, var(--cs-primary), var(--cs-accent));
    border-color: transparent;
    box-shadow: 0 12px 26px -10px rgba(0,93,144,0.45);
  }
  .kind-tab.on > .material-symbols-outlined { color: #fff; font-variation-settings: 'FILL' 1; }
  .kind-tab.on b, .kind-tab.on i { color: #fff; }
  .kind-tab.on i { color: rgba(255,255,255,0.78); }
  .kind-check {
    position: absolute; top: 8px; right: 8px;
    color: rgba(255,255,255,0.9);
  }
  .kind-check .material-symbols-outlined {
    font-size: 18px; font-variation-settings: 'FILL' 1;
  }

  /* Step strip */
  .step-strip {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    padding: 14px 18px;
    margin-bottom: 18px;
    background: var(--cs-card-solid);
    border: 1px solid var(--cs-line);
    border-radius: var(--cs-r-lg);
    box-shadow: var(--cs-shadow-sm);
  }
  @media (max-width: 720px) { .step-strip { display: none; } }
  .step {
    display: flex; align-items: center; gap: 10px;
    position: relative;
  }
  .step-num {
    width: 28px; height: 28px;
    border-radius: 999px;
    background: rgba(0,0,0,0.04);
    color: var(--cs-muted);
    display: grid; place-items: center;
    font-family: 'Manrope', sans-serif;
    font-weight: 800; font-size: 13px;
    flex-shrink: 0;
  }
  .step-num .material-symbols-outlined { font-size: 16px; }
  .step-label b {
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 13.5px;
    color: var(--cs-muted);
  }
  .step.on .step-num {
    background: linear-gradient(135deg, var(--cs-primary), var(--cs-accent));
    color: #fff;
    box-shadow: 0 6px 14px -4px rgba(0,93,144,0.45);
  }
  .step.on .step-label b { color: var(--cs-ink); }
  .step.done .step-num {
    background: var(--green-soft);
    color: var(--green);
  }
  .step.done .step-label b { color: var(--cs-ink-soft); }
  .step-line {
    flex: 1;
    height: 2px;
    margin: 0 4px;
    background: repeating-linear-gradient(to right, var(--cs-line-strong) 0 6px, transparent 6px 12px);
  }
  .step.done .step-line {
    background: var(--green-soft);
  }

  /* Main grid */
  .pub-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 1080px) {
    .pub-grid { grid-template-columns: 1fr; }
    .pub-side { position: relative !important; top: 0 !important; }
  }
  .pub-main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .pub-side {
    position: sticky; top: 88px;
    display: flex; flex-direction: column; gap: 16px;
  }

  .card {
    background: var(--cs-card-solid);
    border: 1px solid var(--cs-line);
    border-radius: var(--cs-r-lg);
    box-shadow: var(--cs-shadow-sm);
  }

  /* Form card */
  .form-card { padding: 22px 24px; }
  .fc-head {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 18px;
    padding-bottom: 16px;
    border-bottom: 1px dashed var(--cs-line);
  }
  .fc-icn {
    width: 40px; height: 40px;
    border-radius: 12px;
    background: var(--cs-primary-soft);
    color: var(--cs-primary);
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .fc-icn .material-symbols-outlined { font-size: 21px; font-variation-settings: 'FILL' 1; }
  .fc-icn.accent {
    background: linear-gradient(135deg, var(--cs-primary), var(--cs-accent));
    color: #fff;
  }
  .fc-info { flex: 1; min-width: 0; }
  .fc-t {
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: 16.5px;
    color: var(--cs-ink);
    letter-spacing: -0.01em;
  }
  .fc-d {
    margin-top: 3px;
    font-size: 12.5px;
    color: var(--cs-muted);
  }
  .fc-body { display: flex; flex-direction: column; gap: 4px; }

  /* Field */
  .field-row {
    display: grid;
    grid-template-columns: 140px minmax(0, 1fr);
    gap: 20px;
    padding: 14px 0;
    align-items: start;
    border-top: 1px dashed var(--cs-line);
  }
  .field-row:first-of-type { border-top: none; padding-top: 4px; }
  .field-label {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--cs-ink-soft);
    line-height: 1.5;
    padding-top: 8px;
  }
  .field-label .req {
    color: var(--rose);
    font-style: normal;
    margin-left: 2px;
  }
  .field-help {
    display: block;
    margin-top: 4px;
    font-size: 11.5px;
    color: var(--cs-muted);
    font-weight: 400;
    line-height: 1.55;
  }
  .field-val {
    min-width: 0;
    position: relative;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  @media (max-width: 720px) {
    .field-row { grid-template-columns: 1fr; gap: 8px; }
    .field-label { padding-top: 0; }
  }

  /* Inputs */
  .inp {
    width: 100%;
    height: 40px;
    border: 1px solid var(--cs-line);
    background: #fff;
    border-radius: 10px;
    padding: 0 14px;
    font-family: inherit; font-size: 13.5px;
    color: var(--cs-ink);
    outline: none;
    transition: all 160ms var(--cs-ease);
  }
  .inp:focus { border-color: var(--cs-primary); box-shadow: var(--cs-shadow-focus); }
  .inp.ta {
    padding: 12px 14px;
    height: auto;
    resize: vertical;
    line-height: 1.6;
    font-family: inherit;
  }
  .inp.sel {
    appearance: none; -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12' fill='%2364748b'><path d='M2 4.5l4 4 4-4z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 12px center;
    background-size: 12px;
    padding-right: 32px;
    cursor: pointer;
  }
  .inp-count {
    position: absolute;
    right: 12px; top: 50%;
    transform: translateY(-50%);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--cs-muted-2);
    pointer-events: none;
  }
  .field-val:has(.inp.ta) .inp-count {
    right: 12px; top: auto; bottom: 12px; transform: none;
  }
  .inp-suffix {
    font-size: 12.5px;
    color: var(--cs-muted);
  }
  .inp-row { display: flex; gap: 8px; width: 100%; flex-wrap: wrap; }

  /* Image uploader */
  .img-uploader {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 12px;
  }
  .img-slot {
    aspect-ratio: 1 / 1;
    border-radius: var(--cs-r-md);
    position: relative;
    overflow: hidden;
  }
  .img-slot.filled {
    background: linear-gradient(135deg, #cde2f0, #6f9ec7);
    box-shadow: var(--cs-shadow-sm);
  }
  .img-slot.cover {
    background: linear-gradient(135deg, #e6cf94, #b88a3e);
  }
  .img-ph {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px;
    color: rgba(255,255,255,0.95);
  }
  .img-ph .material-symbols-outlined {
    font-size: 28px;
    font-variation-settings: 'FILL' 1;
  }
  .img-ph span:last-child {
    font-family: 'Manrope', sans-serif;
    font-weight: 700; font-size: 12px;
    letter-spacing: 0.04em;
  }
  .img-cover-tag {
    position: absolute;
    top: 8px; left: 8px;
    background: rgba(0,0,0,0.5);
    color: #fff;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .img-rm {
    position: absolute;
    top: 6px; right: 6px;
    width: 24px; height: 24px;
    border-radius: 999px;
    background: rgba(0,0,0,0.5);
    color: #fff;
    border: none; cursor: pointer;
    display: grid; place-items: center;
    transition: all 140ms var(--cs-ease);
  }
  .img-rm:hover { background: var(--rose); }
  .img-rm .material-symbols-outlined { font-size: 14px; }
  .img-slot.empty {
    background: rgba(0,0,0,0.025);
    border: 2px dashed var(--cs-line-strong);
    cursor: pointer;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 4px;
    color: var(--cs-muted);
    font-family: inherit; font-size: 12px;
    font-weight: 600;
    transition: all 180ms var(--cs-ease);
  }
  .img-slot.empty:hover {
    background: var(--cs-primary-soft);
    border-color: var(--cs-primary);
    color: var(--cs-primary);
  }
  .img-slot.empty .material-symbols-outlined { font-size: 28px; }
  .img-slot.empty i {
    font-style: normal;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--cs-muted-2);
  }

  /* Category grid (icon chips) */
  .cat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 8px;
    width: 100%;
  }
  .cat-chip {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px;
    background: #fff;
    border: 1px solid var(--cs-line);
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 600;
    color: var(--cs-ink-soft);
    transition: all 160ms var(--cs-ease);
  }
  .cat-chip .material-symbols-outlined {
    font-size: 18px;
    color: var(--cs-muted);
  }
  .cat-chip:hover { border-color: var(--cs-primary); color: var(--cs-primary); }
  .cat-chip:hover .material-symbols-outlined { color: var(--cs-primary); }
  .cat-chip.on {
    background: var(--cs-primary-soft);
    color: var(--cs-primary);
    border-color: var(--cs-primary);
  }
  .cat-chip.on .material-symbols-outlined {
    color: var(--cs-primary);
    font-variation-settings: 'FILL' 1;
  }

  /* Chip choice (segmented w/ description) */
  .chip-choice {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 8px;
    width: 100%;
  }
  .chip-opt {
    background: #fff;
    border: 1px solid var(--cs-line);
    border-radius: 12px;
    padding: 10px 12px;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    display: flex; flex-direction: column; gap: 2px;
    transition: all 160ms var(--cs-ease);
  }
  .chip-opt b {
    font-family: 'Manrope', sans-serif;
    font-weight: 700; font-size: 13.5px;
    color: var(--cs-ink);
    display: block;
  }
  .chip-opt i {
    font-style: normal;
    font-size: 11px;
    color: var(--cs-muted);
  }
  .chip-opt:hover { border-color: var(--cs-line-strong); }
  .chip-opt.on {
    background: var(--cs-primary-soft);
    border-color: var(--cs-primary);
  }
  .chip-opt.on b { color: var(--cs-primary); }

  /* Seg small */
  .seg-small {
    display: inline-flex;
    background: rgba(0,0,0,0.04);
    border-radius: 10px;
    padding: 3px;
    gap: 2px;
    flex-wrap: wrap;
  }
  .seg-small button {
    padding: 7px 12px;
    border-radius: 8px;
    border: none; background: transparent;
    cursor: pointer;
    font-family: inherit; font-size: 12.5px; font-weight: 600;
    color: var(--cs-muted);
    transition: all 160ms var(--cs-ease);
    display: inline-flex; align-items: center; gap: 5px;
  }
