<!DOCTYPE html>
<html class="light" lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CampusShare | 开始发布</title>
<script src="/pages/assets/vendor/tailwindcss.js"></script>
<link href="/pages/assets/fonts/campusshare-fonts.css" rel="stylesheet"/>
<link href="/pages/assets/fonts/material-symbols.css" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    primary: "#005d90",
                    "primary-strong": "#004b74",
                    "on-primary": "#ffffff",
                    surface: "#f5f5f7",
                    "surface-card": "#ffffff",
                    "surface-soft": "#eef3f7",
                    line: "rgba(120,133,150,0.18)",
                    muted: "#667085",
                    ink: "#172033",
                    danger: "#b42318",
                    tertiary: "#3454d1"
                },
                borderRadius: {
                    DEFAULT: "8px",
                    lg: "10px",
                    xl: "16px",
                    full: "999px"
                },
                fontFamily: {
                    headline: ["Manrope", "Noto Sans SC", "Microsoft YaHei", "sans-serif"],
                    body: ["Inter", "Noto Sans SC", "Microsoft YaHei", "sans-serif"]
                }
            }
        }
    };
</script>
<style>
    :root {
        --publish-bg: #f5f5f7;
        --publish-card: rgba(255, 255, 255, 0.82);
        --publish-line: rgba(120, 133, 150, 0.18);
        --publish-shadow: 0 22px 56px rgba(15, 23, 42, 0.08);
        --publish-ease: cubic-bezier(0.2, 0, 0, 1);
    }
    * { box-sizing: border-box; }
    html { text-rendering: optimizeLegibility; }
    body {
        margin: 0;
        min-height: 100vh;
        color: #172033;
        font-family: "Inter", "Noto Sans SC", "Microsoft YaHei", sans-serif;
        background:
            radial-gradient(circle at 14% 10%, rgba(0, 93, 144, 0.09), transparent 24rem),
            radial-gradient(circle at 86% 6%, rgba(52, 84, 209, 0.06), transparent 22rem),
            linear-gradient(180deg, #ffffff 0%, var(--publish-bg) 42%);
        text-wrap: pretty;
    }
    body[data-embedded="true"] {
        background: transparent !important;
    }
    h1, h2, h3, .headline-font {
        font-family: "Manrope", "Noto Sans SC", "Microsoft YaHei", sans-serif;
        letter-spacing: 0;
    }
    button, a, input, select, textarea {
        transition: color 180ms var(--publish-ease), background-color 180ms var(--publish-ease),
            border-color 180ms var(--publish-ease), box-shadow 180ms var(--publish-ease), transform 180ms var(--publish-ease);
    }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
        outline: 2px solid rgba(0, 93, 144, 0.34);
        outline-offset: 3px;
    }
    .material-symbols-outlined {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        font-variation-settings: "FILL" 0, "wght" 430, "GRAD" 0, "opsz" 24;
    }
    .publish-glass {
        border: 1px solid var(--publish-line);
        background: var(--publish-card);
        backdrop-filter: blur(20px);
        box-shadow: var(--publish-shadow);
    }
    .publish-nav {
        border-bottom: 1px solid rgba(120, 133, 150, 0.12);
        background: rgba(255, 255, 255, 0.78);
        backdrop-filter: blur(18px);
    }
    body[data-embedded="true"] .publish-nav,
    body[data-embedded="true"] footer,
    body[data-embedded="true"] [data-publish-aside] {
        display: none !important;
    }
    body[data-embedded="true"] main {
        max-width: none !important;
        padding: 0 !important;
    }
    body[data-embedded="true"] [data-publish-layout] {
        display: block !important;
    }
    body[data-embedded="true"] [data-publish-card] {
        border: 0 !important;
        background: transparent !important;
        box-shadow: none !important;
        backdrop-filter: none !important;
        padding: 0 !important;
    }
    input, select, textarea {
        border: 1px solid rgba(120, 133, 150, 0.16) !important;
        background: rgba(255, 255, 255, 0.86) !important;
    }
    input:hover, select:hover, textarea:hover {
        border-color: rgba(0, 93, 144, 0.24) !important;
    }
    input:focus, select:focus, textarea:focus {
        border-color: rgba(0, 93, 144, 0.44) !important;
        box-shadow: 0 0 0 4px rgba(0, 93, 144, 0.10) !important;
        outline: 0;
    }
    [data-role="publish-upload-panel"] {
        border-color: rgba(0, 93, 144, 0.24);
        background:
            linear-gradient(180deg, rgba(238, 246, 251, 0.72), rgba(255, 255, 255, 0.62)),
            rgba(255, 255, 255, 0.76);
    }
    [data-role="publish-upload-panel"]:hover {
        border-color: rgba(0, 93, 144, 0.46);
        box-shadow: inset 0 0 0 1px rgba(0, 93, 144, 0.08);
    }
    @media (max-width: 980px) {
        [data-publish-layout] { grid-template-columns: 1fr !important; }
    }
</style>
</head>
<body class="text-ink">
<header class="publish-nav sticky top-0 z-50">
    <div class="mx-auto flex h-[72px] max-w-[1440px] items-center justify-between px-6 lg:px-9">
        <button class="headline-font text-xl font-extrabold text-[#005d90]" data-nav-target="/pages/market_overview.html" type="button">CampusShare</button>
        <nav class="hidden items-center gap-6 text-sm font-bold md:flex">
            <a class="text-slate-600 hover:text-[#005d90]" data-nav-target="/pages/market_listing.html" href="#">交易市场</a>
            <a class="text-slate-600 hover:text-[#005d90]" data-nav-target="/pages/market_listing.html?view=MATERIAL" href="#">学术资源</a>
            <a class="text-slate-600 hover:text-[#005d90]" data-nav-target="/pages/market_listing.html?view=FORUM" href="#">校园论坛</a>
        </nav>
        <button class="rounded-full bg-[#005d90] px-5 py-2 text-sm font-bold text-white hover:bg-[#004b74]" data-nav-target="/pages/publish_create.html" type="button">发布</button>
    </div>
</header>

<main class="mx-auto max-w-7xl px-6 py-10 lg:px-8">
    <div class="grid grid-cols-1 gap-8 lg:grid-cols-[300px_minmax(0,1fr)]" data-publish-layout>
        <aside class="space-y-6" data-publish-aside>
            <div>
                <p class="mb-3 text-xs font-extrabold uppercase tracking-[0.18em] text-[#005d90]">Create Listing</p>
                <h1 class="headline-font text-4xl font-extrabold leading-tight text-slate-950" data-role="publish-page-title">创建新发布</h1>
                <p class="mt-4 text-sm leading-7 text-slate-600">发布二手商品、学习资料或团队招募，让信息更快到达需要的人。</p>
            </div>
            <div class="publish-glass rounded-2xl p-5">
                <div class="space-y-5">
                    <div class="flex items-start gap-3">
                        <div class="flex h-8 w-8 items-center justify-center rounded-full bg-[#005d90] text-sm font-bold text-white">1</div>
                        <div>
                            <h3 class="font-bold text-[#005d90]">核心详情</h3>
                            <p class="text-xs text-slate-500">标题、分类与新旧程度</p>
                        </div>
                    </div>
                    <div class="flex items-start gap-3">
                        <div class="flex h-8 w-8 items-center justify-center rounded-full bg-slate-100 text-sm font-bold text-slate-400">2</div>
                        <div>
                            <h3 class="font-bold text-slate-500">媒体与文件</h3>
                            <p class="text-xs text-slate-500">上传图片或 PDF 资源</p>
                        </div>
                    </div>
                    <div class="flex items-start gap-3">
                        <div class="flex h-8 w-8 items-center justify-center rounded-full bg-slate-100 text-sm font-bold text-slate-400">3</div>
                        <div>
                            <h3 class="font-bold text-slate-500">交易信息</h3>
                            <p class="text-xs text-slate-500">价格、地点与补充说明</p>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <section class="min-w-0">
            <div class="publish-glass rounded-2xl p-6 lg:p-8" data-publish-card>
                <form class="space-y-9" data-role="publish-form">
                    <section class="space-y-5">
                        <div class="flex items-center gap-2">
                            <span class="h-6 w-1.5 rounded-full bg-[#005d90]"></span>
                            <h2 class="headline-font text-xl font-extrabold text-slate-950">基本信息</h2>
                        </div>
                        <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
                            <div class="space-y-2 md:col-span-2">
                                <label class="text-xs font-extrabold uppercase tracking-[0.16em] text-slate-500" data-role="publish-title-label">商品标题</label>
                                <input class="w-full rounded-xl px-4 py-3 text-sm" data-role="publish-title" placeholder="例如：有机化学第四版 - Smith" type="text"/>
                            </div>
                            <div class="space-y-2">
                                <label class="text-xs font-extrabold uppercase tracking-[0.16em] text-slate-500" data-role="publish-category-label">分类</label>
                                <select class="w-full rounded-xl px-4 py-3 text-sm" data-role="publish-category">
                                    <option value="">选择分类</option>
                                    <option>教材</option>
                                    <option>学术资源（电子版）</option>
                                    <option>实验设备</option>
                                    <option>电子产品</option>
                                </select>
                            </div>
                            <div class="space-y-2" data-role="publish-condition-section">
                                <label class="text-xs font-extrabold uppercase tracking-[0.16em] text-slate-500">新旧程度</label>
                                <div class="flex gap-2">
                                    <button class="flex-1 rounded-xl border border-[#005d90] bg-[#eef6fb] py-2 text-xs font-bold text-[#005d90]" data-role="publish-condition-button" type="button">全新</button>
                                    <button class="flex-1 rounded-xl border border-transparent bg-slate-100 py-2 text-xs font-bold text-slate-600" data-role="publish-condition-button" type="button">二手</button>
                                    <button class="flex-1 rounded-xl border border-transparent bg-slate-100 py-2 text-xs font-bold text-slate-600" data-role="publish-condition-button" type="button">电子版</button>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section class="space-y-5">
                        <div class="flex items-center gap-2">
                            <span class="h-6 w-1.5 rounded-full bg-[#006878]"></span>
                            <h2 class="headline-font text-xl font-extrabold text-slate-950">上传媒体与文件</h2>
                        </div>
                        <div class="flex cursor-pointer flex-col items-center justify-center rounded-2xl border-2 border-dashed p-9 text-center" data-role="publish-upload-panel">
                            <div class="mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-white shadow-sm">
                                <span class="material-symbols-outlined text-3xl text-[#005d90]">cloud_upload</span>
                            </div>
                            <p class="mb-1 font-bold text-slate-900" data-role="publish-upload-title">拖放图片或文档</p>
                            <p class="max-w-sm text-xs leading-6 text-slate-500" data-role="publish-upload-description">支持 JPG、PNG、PDF，最大 25MB。建议为教材提供清晰图片。</p>
                            <button class="mt-4 text-sm font-extrabold text-[#005d90] underline underline-offset-4" data-role="publish-browse-file" type="button">浏览文件</button>
                        </div>
                    </section>

                    <section class="space-y-5">
                        <div class="flex items-center gap-2">
                            <span class="h-6 w-1.5 rounded-full bg-[#3454d1]"></span>
                            <h2 class="headline-font text-xl font-extrabold text-slate-950">交易与内容</h2>
                        </div>
                        <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
                            <div class="space-y-2">
                                <label class="text-xs font-extrabold uppercase tracking-[0.16em] text-slate-500" data-role="publish-price-label">价格（元）</label>
                                <div class="relative">
                                    <span class="absolute left-4 top-1/2 -translate-y-1/2 font-bold text-slate-400" data-role="publish-price-prefix">¥</span>
                                    <input class="w-full rounded-xl py-3 pl-9 pr-4 text-sm" data-role="publish-price" placeholder="0.00" type="number"/>
                                </div>
                                <p class="text-[10px] text-slate-400">输入 0 表示免费或捐赠</p>
                            </div>
                            <div class="space-y-2">
                                <label class="text-xs font-extrabold uppercase tracking-[0.16em] text-slate-500" data-role="publish-location-label">交易地点</label>
                                <select class="w-full rounded-xl px-4 py-3 text-sm" data-role="publish-location">
                                    <option>主校区图书馆</option>
                                    <option>学生会北楼</option>
                                    <option>工程学部广场</option>
                                    <option>远程（电子下载）</option>
                                </select>
                            </div>
                            <div class="space-y-2 md:col-span-2">
                                <label class="text-xs font-extrabold uppercase tracking-[0.16em] text-slate-500" data-role="publish-description-label">详细描述</label>
                                <textarea class="w-full resize-none rounded-xl px-4 py-3 text-sm leading-6" data-role="publish-description" placeholder="描述物品新旧程度、包含的章节或任何缺页情况..." rows="5"></textarea>
                            </div>
                        </div>
                    </section>

                    <section class="rounded-2xl border border-[rgba(0,104,120,0.20)] bg-[#f1fbfd] p-5" data-role="publish-copyright-section">
                        <label class="flex cursor-pointer items-start gap-3">
                            <input class="mt-1 h-5 w-5 rounded border-slate-300 text-[#006878]" data-role="publish-copyright" type="checkbox"/>
                            <span class="text-sm leading-6 text-slate-700" data-role="publish-copyright-text">我声明此材料（如为电子版）不违反版权政策，并且我有权在 CampusShare 网络内共享此内容。</span>
                        </label>
                    </section>

                    <div class="flex items-center justify-end gap-3 border-t border-[rgba(120,133,150,0.16)] pt-5">
                        <button class="rounded-full px-5 py-3 font-bold text-slate-600 hover:bg-white hover:text-[#005d90]" type="button">放弃草稿</button>
                        <button class="rounded-full bg-[#005d90] px-9 py-3 font-extrabold text-white hover:bg-[#004b74]" data-role="publish-submit" type="submit">发布商品</button>
                    </div>
                </form>
            </div>
        </section>
    </div>
</main>

<footer class="mx-auto max-w-7xl px-6 py-10 lg:px-8">
    <div class="flex flex-col items-center justify-between gap-4 border-t border-[rgba(120,133,150,0.16)] pt-6 text-xs text-slate-500 md:flex-row">
        <span class="headline-font font-extrabold text-slate-900">CampusShare</span>
        <span>&copy; 2026 CampusShare</span>
        <div class="flex flex-wrap justify-center gap-5">
            <a class="hover:text-[#005d90]" href="#">隐私政策</a>
            <a class="hover:text-[#005d90]" href="#">服务条款</a>
            <a class="hover:text-[#005d90]" href="#">支持</a>
        </div>
    </div>
</footer>
<script>
    if (new URLSearchParams(window.location.search).get("embedded") === "1") {
        document.body.setAttribute("data-embedded", "true");
    }
</script>
<script src="/pages/assets/js/campusshare-api.js?v=20260512-apple-refine"></script>
<script src="/pages/assets/js/publish-create.js?v=20260512-apple-refine"></script>
</body>
</html>
