<!DOCTYPE html>
<html class="light" lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>团队招募 | CampusShare</title>
<script src="/pages/assets/vendor/tailwindcss.js"></script>
<link href="/pages/assets/fonts/campusshare-fonts.css" rel="stylesheet"/>
<link href="/pages/assets/fonts/material-symbols.css" rel="stylesheet"/>
<link href="/pages/assets/css/campusshare-modern.css" rel="stylesheet"/>
<script id="tailwind-config">
tailwind.config = {
    darkMode: "class",
    theme: {
        extend: {
            colors: {
                primary: "#005d90",
                "primary-strong": "#004b74",
                "primary-soft": "#eef6fb",
                surface: "#f5f5f7",
                card: "#ffffff",
                line: "rgba(120,133,150,0.16)",
                muted: "#64748b",
                ink: "#172033",
                tertiary: "#3454d1",
                error: "#b42318",
                success: "#0a8a4f",
                /* MD compat — JS sets these class names in rendered card HTML */
                "surface-container-lowest": "#ffffff",
                "surface-container-low": "#f3f4f5",
                "surface-container": "#edeeef",
                "surface-container-high": "#e7e8e9",
                "surface-container-highest": "#e1e3e4",
                "on-primary": "#ffffff",
                "on-surface": "#191c1d",
                "on-surface-variant": "#404850",
                "primary-container": "#0077b6",
                "on-primary-container": "#f3f7ff",
                "on-error": "#ffffff",
                "outline": "#707881",
                "outline-variant": "#bfc7d1"
            },
            borderRadius: { DEFAULT: "8px", md: "10px", lg: "12px", xl: "16px", full: "999px" },
            fontFamily: {
                headline: ["Manrope", "Noto Sans SC", "Microsoft YaHei", "sans-serif"],
                body: ["Inter", "Noto Sans SC", "Microsoft YaHei", "sans-serif"]
            }
        }
    }
};
</script>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--cs-font-body);
        background: var(--cs-surface);
        color: var(--cs-ink);
        text-wrap: pretty;
    }
    h1, h2, h3 { font-family: var(--cs-font-headline); letter-spacing: 0; }
    .material-symbols-outlined {
        line-height: 1;
        font-variation-settings: "FILL" 0, "wght" 430, "GRAD" 0, "opsz" 24;
    }

    /* Embedded mode */
    [data-user-topbar], [data-user-sidebar], footer { display: none; }
    body:not(.campusshare-embedded-page) [data-user-main] { margin-left: 16.75rem; }
    .campusshare-embedded-page [data-user-main] {
        margin-left: 0 !important;
        padding: 0 !important;
    }

    /* Filter chip buttons */
    .recruit-chip {
        display: inline-flex;
        align-items: center;
        padding: 6px 14px;
        border-radius: var(--cs-radius-full);
        font-size: 12px;
        font-weight: 600;
        border: 1px solid var(--cs-line);
        background: var(--cs-card);
        color: var(--cs-muted);
        cursor: pointer;
        transition: background-color 180ms var(--cs-ease), color 180ms var(--cs-ease),
            border-color 180ms var(--cs-ease);
    }
    .recruit-chip.is-active,
    .recruit-chip:focus {
        background: var(--cs-primary-soft);
        color: var(--cs-primary);
        border-color: transparent;
    }
    .recruit-chip:hover:not(.is-active) {
        background: rgba(120,133,150,0.06);
        color: var(--cs-ink);
    }
</style>
</head>
<body>
<header data-user-topbar></header>
<div class="flex min-h-screen" data-user-shell>
<aside data-user-sidebar></aside>
<main class="flex-1" data-user-main>

    <!-- Hero / Header — JS: main section.px-8.pt-8.pb-4 -->
    <section class="px-8 pt-8 pb-4">
        <div class="flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
            <div>
                <h1 class="cs-h1 mb-1">团队招募</h1>
                <p class="cs-body" style="color:var(--cs-muted);">寻找志同道合的伙伴，共建项目团队</p>
            </div>
            <button class="cs-btn cs-btn--primary" data-role="recruitment-publish-button" type="button">
                <span class="material-symbols-outlined" style="font-size:18px;">add</span>
                发布招募
            </button>
        </div>

        <!-- Filter bar — JS: heroSection.querySelector(".mt-8.flex.flex-wrap.items-center.gap-3") -->
        <div class="mt-8 flex flex-wrap items-center gap-3">
            <button class="recruit-chip is-active" type="button">所有分类</button>
            <button class="recruit-chip" type="button">研究</button>
            <button class="recruit-chip" type="button">竞赛</button>
            <button class="recruit-chip" type="button">运动</button>
            <button class="recruit-chip" type="button">创意艺术</button>
            <button class="recruit-chip" type="button">志愿服务</button>
        </div>
    </section>

    <!-- Recruitment grid — JS: main section.px-8.py-6.grid -->
    <section class="px-8 py-6 grid grid-cols-1 gap-5 md:grid-cols-2 lg:grid-cols-3">
        <div class="col-span-1 md:col-span-2 lg:col-span-3 rounded-xl p-10 text-center"
             style="background:var(--cs-card);border:1px solid var(--cs-line);">
            <span class="material-symbols-outlined" style="font-size:40px;color:var(--cs-primary);opacity:0.35;">groups</span>
            <p class="mt-3 text-sm font-medium" style="color:var(--cs-muted);">正在加载组队招募</p>
            <p class="mt-1 text-xs" style="color:var(--cs-muted);">正在同步最新招募、成员名额与申请状态</p>
        </div>
    </section>

</main>
</div>
<footer></footer>
<script src="/pages/assets/js/campusshare-api.js?v=20260515"></script>
<script src="/pages/assets/js/recruitment-board.js?v=20260515"></script>
</body>
</html>
