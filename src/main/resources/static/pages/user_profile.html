<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CampusShare - 个人资料</title>
<link href="/pages/assets/fonts/campusshare-fonts.css" rel="stylesheet"/>
<link href="/pages/assets/fonts/material-symbols.css" rel="stylesheet"/>
<script src="/pages/assets/vendor/tailwindcss.js"></script>
<style>
body{margin:0;min-height:100vh;font-family:"Inter","Noto Sans SC","Microsoft YaHei",sans-serif;background:#f5f5f7;color:#172033;text-wrap:pretty}h1,h2,h3{font-family:"Manrope","Noto Sans SC","Microsoft YaHei",sans-serif}.material-symbols-outlined{display:inline-flex;line-height:1;font-variation-settings:"FILL" 0,"wght" 430,"GRAD" 0,"opsz" 24}.glass{border:1px solid rgba(120,133,150,.18);background:rgba(255,255,255,.88);box-shadow:0 20px 52px rgba(15,23,42,.08);backdrop-filter:blur(18px)}[data-user-topbar],[data-user-sidebar],footer{display:none}.campusshare-embedded-page main{margin-left:0!important;padding:1.5rem!important;max-width:none!important}.profile-modern-shell{max-width:none!important}
</style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
<header data-user-topbar></header>
<div class="flex" data-user-shell>
<aside data-user-sidebar></aside>
<main class="profile-modern-shell mx-auto w-full max-w-7xl px-6 py-8" data-user-main>
    <div data-role="message-bar" class="mb-5 hidden rounded-xl border px-3 py-2 text-sm"></div>
    <div class="glass mb-6 flex flex-wrap items-center justify-between gap-3 rounded-2xl p-6">
        <div>
            <h1 class="text-3xl font-extrabold text-slate-950">个人资料设置</h1>
            <p class="mt-1 text-sm text-slate-500">查看并维护你的账号资料、积分和认证状态。</p>
        </div>
        <div class="flex items-center gap-2">
            <a class="rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100" href="/pages/order_center.html" data-nav-target="/pages/order_center.html">订单中心</a>
            <a class="rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100" href="/pages/my_publish.html" data-nav-target="/pages/my_publish.html">我的发布</a>
            <button type="button" data-action="logout" class="rounded-full border border-red-200 bg-white px-4 py-2 text-sm font-semibold text-red-600 hover:bg-red-50">退出登录</button>
        </div>
    </div>
    <div class="grid gap-6 lg:grid-cols-3">
        <section class="glass rounded-2xl p-6 lg:col-span-2">
            <div class="flex flex-wrap items-start justify-between gap-4">
                <div class="flex items-center gap-4">
                    <div class="flex h-16 w-16 items-center justify-center overflow-hidden rounded-2xl bg-[#eef6fb] text-2xl font-bold text-[#005d90]" data-role="avatar-initials">--</div>
                    <div>
                        <h2 class="text-2xl font-bold text-slate-950" data-role="display-name">加载中</h2>
                        <p class="text-sm text-slate-500">账号：<span data-role="account">-</span></p>
                        <p class="mt-1 text-xs text-slate-500">角色：<span data-role="role-text">-</span> · 状态：<span data-role="status-text">-</span></p>
                    </div>
                </div>
                <div class="flex flex-wrap justify-end gap-2">
                    <label class="cursor-pointer rounded-full border border-sky-200 bg-[#eef6fb] px-4 py-2 text-sm font-semibold text-[#005d90] hover:bg-white">
                        上传头像
                        <input type="file" accept="image/png,image/jpeg,image/webp" class="hidden" data-action="avatar-upload"/>
                    </label>
                    <button type="button" data-action="open-edit" class="rounded-full bg-[#005d90] px-4 py-2 text-sm font-semibold text-white hover:bg-[#004b74]">编辑资料</button>
                </div>
            </div>
            <div class="mt-4 hidden rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-700" data-role="avatar-review-hint"></div>
            <div class="mt-6 grid gap-4 sm:grid-cols-2">
                <div class="rounded-2xl bg-slate-50 p-4"><p class="text-xs font-semibold uppercase tracking-wide text-slate-500">学号 / 工号</p><p class="mt-2 text-sm text-slate-800" data-role="account-readonly">-</p></div>
                <div class="rounded-2xl bg-slate-50 p-4"><p class="text-xs font-semibold uppercase tracking-wide text-slate-500">邮箱</p><p class="mt-2 text-sm text-slate-800" data-role="email">-</p></div>
                <div class="rounded-2xl bg-slate-50 p-4"><p class="text-xs font-semibold uppercase tracking-wide text-slate-500">手机号</p><p class="mt-2 text-sm text-slate-800" data-role="phone">-</p></div>
                <div class="rounded-2xl bg-slate-50 p-4"><p class="text-xs font-semibold uppercase tracking-wide text-slate-500">学院</p><p class="mt-2 text-sm text-slate-800" data-role="college">-</p></div>
                <div class="rounded-2xl bg-slate-50 p-4"><p class="text-xs font-semibold uppercase tracking-wide text-slate-500">年级</p><p class="mt-2 text-sm text-slate-800" data-role="grade">-</p></div>
            </div>
            <p class="mt-4 text-xs text-slate-500">最近登录：<span data-role="last-login-time">-</span></p>
        </section>
        <section class="space-y-4">
            <div class="glass rounded-2xl p-5"><p class="text-xs font-semibold uppercase tracking-wide text-slate-500">当前积分</p><p class="mt-3 text-4xl font-extrabold text-[#005d90]" data-role="point-balance">0</p></div>
            <div class="glass rounded-2xl p-5"><p class="text-xs font-semibold uppercase tracking-wide text-slate-500">我的商品</p><p class="mt-3 text-3xl font-bold text-slate-950" data-role="product-count">0</p></div>
            <div class="glass rounded-2xl p-5"><p class="text-xs font-semibold uppercase tracking-wide text-slate-500">我的资料</p><p class="mt-3 text-3xl font-bold text-slate-950" data-role="material-count">0</p></div>
        </section>
    </div>
    <section class="mt-6 grid gap-6 lg:grid-cols-2">
        <div class="glass rounded-2xl p-6"><h3 class="text-lg font-bold text-slate-950">卖家认证</h3><p class="mt-2 text-sm text-slate-500" data-role="seller-verify-status">未发起认证申请</p><button type="button" data-action="seller-verify" class="mt-4 rounded-full border border-sky-200 bg-[#eef6fb] px-4 py-2 text-sm font-semibold text-[#005d90] hover:bg-white">申请认证卖家</button></div>
        <div class="glass rounded-2xl p-6"><h3 class="text-lg font-bold text-slate-950">快捷入口</h3><div class="mt-3 grid grid-cols-2 gap-2 text-sm"><a class="rounded-xl border border-slate-200 bg-white px-3 py-2 text-center text-slate-700 hover:bg-slate-100" href="/pages/market_overview.html" data-nav-target="/pages/market_overview.html">交易市场</a><a class="rounded-xl border border-slate-200 bg-white px-3 py-2 text-center text-slate-700 hover:bg-slate-100" href="/pages/market_listing.html?view=MATERIAL" data-nav-target="/pages/market_listing.html?view=MATERIAL">学术资源</a><a class="rounded-xl border border-slate-200 bg-white px-3 py-2 text-center text-slate-700 hover:bg-slate-100" href="/pages/notification_center.html" data-nav-target="/pages/notification_center.html">消息通知</a><a class="rounded-xl border border-slate-200 bg-white px-3 py-2 text-center text-slate-700 hover:bg-slate-100" href="/pages/order_center.html" data-nav-target="/pages/order_center.html">订单中心</a></div></div>
    </section>
    <section class="glass mt-6 rounded-2xl p-6"><h3 class="text-lg font-bold text-slate-950">积分流水</h3><div data-role="ledger-list" class="mt-4 space-y-3"><div class="rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-500">正在加载积分流水...</div></div></section>
</main>
</div>
<div data-role="profile-edit-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
    <div data-role="modal-overlay" class="absolute inset-0 bg-slate-900/45"></div>
    <div class="relative w-full max-w-lg rounded-2xl bg-white shadow-2xl">
        <div class="flex items-center justify-between border-b border-slate-200 px-6 py-4"><h3 class="text-xl font-bold text-slate-950">编辑资料</h3><button type="button" data-action="close-edit" class="rounded-lg p-1 text-slate-500 hover:bg-slate-100"><span class="material-symbols-outlined">close</span></button></div>
        <form data-role="profile-edit-form" class="space-y-4 px-6 py-5">
            <div class="grid gap-4 sm:grid-cols-2"><div><label class="mb-1 block text-xs font-semibold tracking-wide text-slate-500">学号 / 工号</label><input data-field="accountReadonly" type="text" class="w-full rounded-xl border-slate-300 bg-slate-100 text-sm text-slate-600" readonly/></div><div><label class="mb-1 block text-xs font-semibold tracking-wide text-slate-500">邮箱</label><input data-field="emailReadonly" type="email" class="w-full rounded-xl border-slate-300 bg-slate-100 text-sm text-slate-600" readonly/></div></div>
            <div><label class="mb-1 block text-xs font-semibold tracking-wide text-slate-500">昵称</label><input data-field="displayName" type="text" maxlength="20" class="w-full rounded-xl border-slate-300 text-sm focus:border-sky-500 focus:ring-sky-500" placeholder="请输入昵称"/></div>
            <div class="grid gap-4 sm:grid-cols-2"><div><label class="mb-1 block text-xs font-semibold tracking-wide text-slate-500">学院</label><input data-field="college" type="text" maxlength="50" class="w-full rounded-xl border-slate-300 text-sm focus:border-sky-500 focus:ring-sky-500" placeholder="请输入学院"/></div><div><label class="mb-1 block text-xs font-semibold tracking-wide text-slate-500">年级</label><input data-field="grade" type="text" maxlength="20" class="w-full rounded-xl border-slate-300 text-sm focus:border-sky-500 focus:ring-sky-500" placeholder="请输入年级"/></div></div>
            <div><label class="mb-1 block text-xs font-semibold tracking-wide text-slate-500">手机号</label><input data-field="phone" type="text" maxlength="30" class="w-full rounded-xl border-slate-300 text-sm focus:border-sky-500 focus:ring-sky-500" placeholder="选填"/></div>
            <div class="flex justify-end gap-2 border-t border-slate-200 pt-4"><button type="button" data-action="cancel-edit" class="rounded-full border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100">取消</button><button type="submit" class="rounded-full bg-[#005d90] px-4 py-2 text-sm font-semibold text-white hover:bg-[#004b74]">保存</button></div>
        </form>
    </div>
</div>
<script src="/pages/assets/js/campusshare-api.js"></script>
<script src="/pages/assets/js/user-profile.js?v=20260511-clean"></script>
</body>
</html>
