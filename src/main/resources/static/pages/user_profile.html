<!DOCTYPE html>
<html class="light" lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>个人设置 | CampusShare</title>
<link href="/pages/assets/fonts/campusshare-fonts.css" rel="stylesheet"/>
<link href="/pages/assets/fonts/material-symbols.css" rel="stylesheet"/>
<link href="/pages/assets/css/campusshare-modern.css" rel="stylesheet"/>
<script src="/pages/assets/vendor/tailwindcss.js"></script>
<script id="tailwind-config">
tailwind.config = {
    darkMode: "class",
    theme: {
        extend: {
            colors: {
                primary: "#005d90",
                "primary-strong": "#004b74",
                "primary-soft": "#eef6fb",
                surface: "#f5f5f7",
                card: "#ffffff",
                line: "rgba(120,133,150,0.16)",
                muted: "#64748b",
                ink: "#172033",
                error: "#b42318"
            },
            borderRadius: { DEFAULT: "8px", md: "10px", lg: "12px", xl: "16px", full: "999px" },
            fontFamily: {
                headline: ["Manrope", "Noto Sans SC", "Microsoft YaHei", "sans-serif"],
                body: ["Inter", "Noto Sans SC", "Microsoft YaHei", "sans-serif"]
            }
        }
    }
};
</script>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--cs-font-body);
        background: var(--cs-surface);
        color: var(--cs-ink);
        text-wrap: pretty;
    }
    h1, h2, h3 { font-family: var(--cs-font-headline); letter-spacing: 0; }
    .material-symbols-outlined {
        display: inline-flex;
        line-height: 1;
        font-variation-settings: "FILL" 0, "wght" 430, "GRAD" 0, "opsz" 24;
    }

    /* Embedded mode */
    [data-user-topbar], [data-user-sidebar], footer { display: none; }
    body:not(.campusshare-embedded-page) [data-user-main] { margin-left: 16.75rem; }
    .campusshare-embedded-page [data-user-main] {
        margin-left: 0 !important;
        padding: 1.5rem !important;
        max-width: none !important;
    }

    /* Glass utility */
    .glass {
        border: 1px solid var(--cs-line);
        background: rgba(255,255,255,0.88);
        box-shadow: var(--cs-shadow-sm);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
    }

    /* Form fields in modal */
    [data-role="profile-edit-form"] input {
        height: 40px;
        width: 100%;
        padding: 0 12px;
        border: 1px solid var(--cs-line);
        border-radius: var(--cs-radius-sm);
        font-size: 13px;
        background: var(--cs-card);
        color: var(--cs-ink);
        outline: none;
        transition: border-color 180ms var(--cs-ease), box-shadow 180ms var(--cs-ease);
    }
    [data-role="profile-edit-form"] input:focus {
        border-color: var(--cs-primary);
        box-shadow: var(--cs-shadow-focus);
    }
    [data-role="profile-edit-form"] input[readonly] {
        background: var(--cs-surface);
        color: var(--cs-muted);
        cursor: not-allowed;
    }
</style>
</head>
<body>
<header data-user-topbar></header>
<div class="flex" data-user-shell>
<aside data-user-sidebar></aside>
<main class="w-full max-w-7xl mx-auto px-6 py-8" data-user-main>

    <!-- Message bar — JS adds/removes: hidden, border-emerald-200 bg-emerald-50 text-emerald-700, border-rose-200 bg-rose-50 text-rose-700 -->
    <div class="mb-5 hidden rounded-xl border px-3 py-2 text-sm" data-role="message-bar"></div>

    <!-- Page header -->
    <div class="glass mb-6 flex flex-wrap items-center justify-between gap-3 rounded-xl p-6">
        <div>
            <h1 class="cs-h2">个人资料设置</h1>
            <p class="cs-caption mt-1">查看并维护你的账号资料、积分和认证状态</p>
        </div>
        <div class="flex items-center gap-2">
            <a class="cs-btn cs-btn--secondary" data-nav-target="/pages/order_center.html" href="/pages/order_center.html">订单中心</a>
            <a class="cs-btn cs-btn--secondary" data-nav-target="/pages/my_publish.html" href="/pages/my_publish.html">我的发布</a>
            <button class="cs-btn cs-btn--danger" data-action="logout" type="button">退出登录</button>
        </div>
    </div>

    <!-- Main grid -->
    <div class="grid gap-6 lg:grid-cols-3">

        <!-- Profile card (left 2/3) -->
        <section class="glass rounded-xl p-6 lg:col-span-2">
            <div class="flex flex-wrap items-start justify-between gap-4">
                <div class="flex items-center gap-4">
                    <div class="flex h-16 w-16 items-center justify-center overflow-hidden rounded-xl text-2xl font-bold"
                         style="background:var(--cs-primary-soft);color:var(--cs-primary);"
                         data-role="avatar-initials">--</div>
                    <div>
                        <h2 class="text-xl font-bold" style="color:var(--cs-ink);" data-role="display-name">加载中</h2>
                        <p class="text-sm mt-0.5" style="color:var(--cs-muted);">账号：<span data-role="account">-</span></p>
                        <p class="text-xs mt-1" style="color:var(--cs-muted);">
                            角色：<span data-role="role-text">-</span>
                            &nbsp;·&nbsp;
                            状态：<span data-role="status-text">-</span>
                        </p>
                    </div>
                </div>
                <div class="flex flex-wrap justify-end gap-2">
                    <label class="cs-btn cs-btn--secondary cursor-pointer" style="display:inline-flex;">
                        上传头像
                        <input accept="image/png,image/jpeg,image/webp" class="hidden" data-action="avatar-upload" type="file"/>
                    </label>
                    <button class="cs-btn cs-btn--primary" data-action="open-edit" type="button">编辑资料</button>
                </div>
            </div>

            <!-- Avatar review hint — JS removes 'hidden' class -->
            <div class="mt-4 hidden rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-700"
                 data-role="avatar-review-hint"></div>

            <!-- Info grid -->
            <div class="mt-6 grid gap-3 sm:grid-cols-2">
                <div class="rounded-xl p-4" style="background:var(--cs-surface);">
                    <p class="cs-micro">学号 / 工号</p>
                    <p class="mt-2 text-sm" style="color:var(--cs-ink);" data-role="account-readonly">-</p>
                </div>
                <div class="rounded-xl p-4" style="background:var(--cs-surface);">
                    <p class="cs-micro">邮箱</p>
                    <p class="mt-2 text-sm" style="color:var(--cs-ink);" data-role="email">-</p>
                </div>
                <div class="rounded-xl p-4" style="background:var(--cs-surface);">
                    <p class="cs-micro">手机号</p>
                    <p class="mt-2 text-sm" style="color:var(--cs-ink);" data-role="phone">-</p>
                </div>
                <div class="rounded-xl p-4" style="background:var(--cs-surface);">
                    <p class="cs-micro">学院</p>
                    <p class="mt-2 text-sm" style="color:var(--cs-ink);" data-role="college">-</p>
                </div>
                <div class="rounded-xl p-4" style="background:var(--cs-surface);">
                    <p class="cs-micro">年级</p>
                    <p class="mt-2 text-sm" style="color:var(--cs-ink);" data-role="grade">-</p>
                </div>
            </div>
            <p class="mt-4 text-xs" style="color:var(--cs-muted);">
                最近登录：<span data-role="last-login-time">-</span>
            </p>
        </section>

        <!-- Stats sidebar (right 1/3) -->
        <section class="space-y-4">
            <div class="cs-stat-card">
                <p class="cs-micro">当前积分</p>
                <p class="cs-stat-card__value mt-2" style="color:var(--cs-primary);" data-role="point-balance">0</p>
            </div>
            <div class="cs-stat-card">
                <p class="cs-micro">我的商品</p>
                <p class="cs-stat-card__value mt-2" data-role="product-count">0</p>
            </div>
            <div class="cs-stat-card">
                <p class="cs-micro">我的资料</p>
                <p class="cs-stat-card__value mt-2" data-role="material-count">0</p>
            </div>
        </section>

    </div>

    <!-- Seller verification + quick links -->
    <section class="mt-6 grid gap-6 lg:grid-cols-2">
        <div class="glass rounded-xl p-6">
            <h3 class="text-base font-semibold" style="color:var(--cs-ink);">卖家认证</h3>
            <p class="cs-caption mt-2" data-role="seller-verify-status">未发起认证申请</p>
            <button class="cs-btn cs-btn--secondary mt-4" data-action="seller-verify" type="button">申请认证卖家</button>
        </div>
        <div class="glass rounded-xl p-6">
            <h3 class="text-base font-semibold mb-3" style="color:var(--cs-ink);">快捷入口</h3>
            <div class="grid grid-cols-2 gap-2 text-sm">
                <a class="cs-btn cs-btn--secondary text-center" data-nav-target="/pages/market_overview.html" href="/pages/market_overview.html">交易市场</a>
                <a class="cs-btn cs-btn--secondary text-center" data-nav-target="/pages/market_listing.html?view=MATERIAL" href="/pages/market_listing.html?view=MATERIAL">学术资源</a>
                <a class="cs-btn cs-btn--secondary text-center" data-nav-target="/pages/notification_center.html" href="/pages/notification_center.html">消息通知</a>
                <a class="cs-btn cs-btn--secondary text-center" data-nav-target="/pages/order_center.html" href="/pages/order_center.html">订单中心</a>
            </div>
        </div>
    </section>

    <!-- Point ledger -->
    <section class="glass mt-6 rounded-xl p-6">
        <h3 class="text-base font-semibold" style="color:var(--cs-ink);">积分流水</h3>
        <div class="mt-4 space-y-3" data-role="ledger-list">
            <div class="rounded-xl px-4 py-3 text-sm" style="background:var(--cs-surface);color:var(--cs-muted);">
                正在加载积分流水...
            </div>
        </div>
    </section>

</main>
</div>

<!-- Edit modal — JS: classList.remove("hidden") + add("flex") to open -->
<div class="fixed inset-0 z-50 hidden items-center justify-center p-4" data-role="profile-edit-modal">
    <div class="absolute inset-0 bg-slate-900/45" data-role="modal-overlay"></div>
    <div class="relative w-full max-w-lg rounded-xl shadow-2xl" style="background:var(--cs-card);">
        <div class="flex items-center justify-between px-6 py-4 border-b" style="border-color:var(--cs-line);">
            <h3 class="text-base font-bold" style="color:var(--cs-ink);">编辑资料</h3>
            <button class="cs-btn cs-btn--icon" data-action="close-edit" type="button">
                <span class="material-symbols-outlined" style="font-size:20px;">close</span>
            </button>
        </div>
        <form class="space-y-4 px-6 py-5" data-role="profile-edit-form">
            <div class="grid gap-4 sm:grid-cols-2">
                <div>
                    <label class="cs-label">学号 / 工号</label>
                    <input data-field="accountReadonly" readonly type="text"/>
                </div>
                <div>
                    <label class="cs-label">邮箱</label>
                    <input data-field="emailReadonly" readonly type="email"/>
                </div>
            </div>
            <div>
                <label class="cs-label">昵称</label>
                <input data-field="displayName" maxlength="20" placeholder="请输入昵称" type="text"/>
            </div>
            <div class="grid gap-4 sm:grid-cols-2">
                <div>
                    <label class="cs-label">学院</label>
                    <input data-field="college" maxlength="50" placeholder="请输入学院" type="text"/>
                </div>
                <div>
                    <label class="cs-label">年级</label>
                    <input data-field="grade" maxlength="20" placeholder="请输入年级" type="text"/>
                </div>
            </div>
            <div>
                <label class="cs-label">手机号</label>
                <input data-field="phone" maxlength="30" placeholder="选填" type="text"/>
            </div>
            <div class="flex justify-end gap-2 border-t pt-4" style="border-color:var(--cs-line);">
                <button class="cs-btn cs-btn--secondary" data-action="cancel-edit" type="button">取消</button>
                <button class="cs-btn cs-btn--primary" type="submit">保存</button>
            </div>
        </form>
    </div>
</div>

<footer></footer>
<script src="/pages/assets/js/campusshare-api.js?v=20260515"></script>
<script src="/pages/assets/js/user-profile.js?v=20260515"></script>
</body>
</html>
