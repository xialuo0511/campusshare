<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CampusShare · 个人工作台</title>

<link rel="stylesheet" href="/pages/assets/fonts/campusshare-fonts.css" />
<link rel="stylesheet" href="/pages/assets/fonts/material-symbols.css" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  :root {
    --cs-primary: #005d90;
    --cs-primary-strong: #004b74;
    --cs-primary-soft: #eef6fb;
    --cs-accent: #3454d1;
    --cs-ink: #0b1320;
    --cs-ink-soft: #172033;
    --cs-muted: #64748b;
    --cs-muted-2: #94a3b8;
    --cs-line: rgba(120, 133, 150, 0.18);
    --cs-line-strong: rgba(120, 133, 150, 0.32);
    --cs-card-bg: rgba(255, 255, 255, 0.78);
    --cs-card-solid: #ffffff;
    --cs-shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04), 0 6px 18px -8px rgba(15, 23, 42, 0.08);
    --cs-shadow-md: 0 14px 36px -16px rgba(8, 25, 53, 0.18);
    --cs-shadow-lg: 0 30px 60px -24px rgba(8, 25, 53, 0.22);
    --cs-shadow-focus: 0 0 0 4px rgba(0, 93, 144, 0.16);
    --cs-r-xs: 8px;
    --cs-r-sm: 10px;
    --cs-r-md: 14px;
    --cs-r-lg: 18px;
    --cs-r-xl: 24px;
    --cs-ease: cubic-bezier(0.22, 1, 0.36, 1);
    --bg-base: #f4f6fa;
    --green: #0a8a4f;
    --green-soft: #e7f6ee;
    --amber: #b45309;
    --amber-soft: #fff4e0;
    --rose: #be123c;
    --rose-soft: #ffe4e9;
    --violet: #7c3aed;
    --violet-soft: #f1ebff;
    --blue: #1d6fe0;
    --blue-soft: #e8f0fb;
  }

  * { box-sizing: border-box; }
  html {
    scrollbar-gutter: stable;
  }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg-base);
    color: var(--cs-ink);
    font-family: 'Inter', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body {
    min-height: 100vh;
    background:
      radial-gradient(900px 480px at 8% -10%, rgba(0,93,144,0.10), transparent 60%),
      radial-gradient(900px 480px at 110% 0%, rgba(52,84,209,0.08), transparent 60%),
      linear-gradient(180deg, #ffffff 0%, #f4f6fa 280px);
    text-wrap: pretty;
  }
  .headline { font-family: 'Manrope', 'Noto Sans SC', sans-serif; letter-spacing: -0.01em; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .material-symbols-outlined {
    font-family: 'Material Symbols Outlined';
    font-variation-settings: 'FILL' 0, 'wght' 430, 'GRAD' 0, 'opsz' 24;
    user-select: none;
    line-height: 1;
  }

  /* ───────── Top Nav ───────── */
  .nav {
    position: sticky; top: 0; z-index: 30;
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    background: rgba(255,255,255,0.78);
    border-bottom: 1px solid var(--cs-line);
  }
  .nav-inner {
    max-width: 1440px; margin: 0 auto; height: 64px;
    padding: 0 clamp(16px, 3vw, 32px);
    display: flex; align-items: center; gap: 20px;
  }
  .brand { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; flex-shrink: 0; }
  .brand .logo {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, var(--cs-primary), var(--cs-accent));
    display: grid; place-items: center; color: #fff;
    box-shadow: 0 8px 20px -8px rgba(0,93,144,0.55), inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .brand .logo .material-symbols-outlined { font-size: 19px; font-variation-settings: 'FILL' 1; }
  .brand .name { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 19px; color: var(--cs-ink); letter-spacing: -0.01em; }
  .crumbs {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--cs-muted);
    margin-left: 8px; padding-left: 16px;
    border-left: 1px solid var(--cs-line);
    flex: 1; min-width: 0;
  }
  .crumbs a { color: var(--cs-muted); text-decoration: none; cursor: pointer; }
  .crumbs a:hover { color: var(--cs-primary); }
  .crumbs .here { color: var(--cs-ink); font-weight: 600; }
  .crumbs .material-symbols-outlined { font-size: 14px; color: var(--cs-muted-2); }
  .nav-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 10px;
    border: 1px solid var(--cs-line); background: rgba(255,255,255,0.6);
    cursor: pointer; display: grid; place-items: center;
    position: relative; transition: all 180ms var(--cs-ease); color: var(--cs-ink-soft);
  }
  .icon-btn:hover { border-color: var(--cs-line-strong); background: #fff; transform: translateY(-1px); }
  .icon-btn .material-symbols-outlined { font-size: 19px; }
  .icon-btn .dot-badge {
    position: absolute; top: -5px; right: -5px;
    min-width: 18px; height: 18px; border-radius: 999px;
    background: #ef4444; color: #fff;
    font-size: 10px; font-weight: 700; padding: 0 5px;
    display: inline-flex; align-items: center; justify-content: center;
    line-height: 1; border: 2px solid #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
  }
  .primary-btn {
    height: 38px; padding: 0 18px 0 14px; border-radius: 999px; border: none;
    background: linear-gradient(135deg, var(--cs-primary), var(--cs-accent));
    color: #fff; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 13.5px;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    box-shadow: 0 10px 22px -10px rgba(0,93,144,0.55), inset 0 1px 0 rgba(255,255,255,0.22);
    transition: transform 140ms var(--cs-ease), box-shadow 220ms var(--cs-ease);
  }
  .primary-btn:hover { transform: translateY(-1px); box-shadow: 0 14px 28px -10px rgba(0,93,144,0.7); }
  .primary-btn .material-symbols-outlined { font-size: 17px; }
  .avatar-btn {
    width: 38px; height: 38px; border-radius: 999px;
    background: linear-gradient(135deg, #ffd089, #f0a35a);
    color: #fff; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 14px;
    display: grid; place-items: center; cursor: pointer;
    border: 2px solid #fff; box-shadow: var(--cs-shadow-sm);
  }
  .ghost-btn {
    height: 36px; padding: 0 14px; border-radius: 999px;
    background: rgba(255,255,255,0.7); border: 1px solid var(--cs-line);
    font-family: inherit; font-size: 13px; font-weight: 600;
    color: var(--cs-ink-soft); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all 160ms var(--cs-ease);
  }
  .ghost-btn:hover { border-color: var(--cs-primary); color: var(--cs-primary); background: #fff; }
  .ghost-btn .material-symbols-outlined { font-size: 16px; }

  /* ───────── Layout ───────── */
  .shell {
    max-width: 1440px; margin: 0 auto;
    padding: clamp(16px, 2.5vw, 28px);
    display: grid; grid-template-columns: 260px minmax(0, 1fr);
    gap: 24px; align-items: start;
  }
  @media (max-width: 960px) {
    .shell { grid-template-columns: 1fr; }
    .ws-rail { position: relative !important; top: 0 !important; }
  }
  .glass {
    background: var(--cs-card-bg); border: 1px solid var(--cs-line);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border-radius: var(--cs-r-lg); box-shadow: var(--cs-shadow-sm);
  }
  .card {
    background: var(--cs-card-solid); border: 1px solid var(--cs-line);
    border-radius: var(--cs-r-lg); box-shadow: var(--cs-shadow-sm);
  }

  /* ───────── Workspace Rail ───────── */
  .ws-rail { position: sticky; top: 88px; display: flex; flex-direction: column; gap: 16px; }
  .ws-profile { padding: 18px; }
  .ws-prof-row { display: flex; align-items: center; gap: 12px; }
  .ws-avatar {
    width: 48px; height: 48px; border-radius: 14px;
    background: linear-gradient(135deg, #ffd089, #f0a35a);
    color: #fff; font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 19px;
    display: grid; place-items: center; flex-shrink: 0;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.4);
  }
  .ws-prof-info { min-width: 0; flex: 1; }
  .ws-prof-info .name { font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 15px; color: var(--cs-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ws-prof-info .role { margin-top: 3px; font-size: 12px; color: var(--cs-muted); display: inline-flex; align-items: center; gap: 4px; }
  .ws-prof-info .role .material-symbols-outlined { font-size: 13px; color: var(--green); font-variation-settings: 'FILL' 1; }
  .ws-mini-stats { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--cs-line); display: flex; gap: 14px; font-size: 11.5px; color: var(--cs-muted); }
  .ws-mini-stats b { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 13px; color: var(--cs-ink); margin-right: 4px; }
  .ws-nav { padding: 8px; }
  .ws-link {
    display: grid; grid-template-columns: 22px 1fr auto; align-items: center;
    gap: 12px; padding: 10px 12px; border-radius: var(--cs-r-sm);
    font-size: 13.5px; font-weight: 600; color: var(--cs-muted);
    cursor: pointer; border: none; background: transparent; font-family: inherit;
    width: 100%; text-align: left; transition: all 160ms var(--cs-ease); position: relative;
  }
  .ws-link:hover { background: rgba(0,0,0,0.035); color: var(--cs-ink-soft); }
  .ws-link.active { background: var(--cs-primary-soft); color: var(--cs-primary); }
  .ws-link.active::before {
    content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    width: 3px; height: 18px; border-radius: 0 3px 3px 0; background: var(--cs-primary);
  }
  .ws-link.active .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 500; }
  .ws-link .material-symbols-outlined { font-size: 18px; }
  .ws-link .badge { background: rgba(0,93,144,0.10); color: var(--cs-primary); font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; }
  .ws-link .badge.red { background: rgba(239,68,68,0.10); color: #ef4444; }
  .ws-divider { height: 1px; background: var(--cs-line); margin: 8px 12px; }
  .ws-label { padding: 8px 16px 6px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.14em; color: var(--cs-muted-2); text-transform: uppercase; }

  /* ───────── Page Header ───────── */
  .page-head { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
  .page-head .ttl-block { min-width: 0; }
  .page-head .ttl { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: clamp(24px, 2.8vw, 32px); color: var(--cs-ink); letter-spacing: -0.02em; line-height: 1.1; }
  .page-head .sub { margin-top: 6px; font-size: 13.5px; color: var(--cs-muted); line-height: 1.5; }
  .page-head .actions { display: flex; gap: 8px; flex-shrink: 0; }

  /* Segmented tabs */
  .seg { display: inline-flex; background: rgba(0,0,0,0.04); border-radius: 999px; padding: 4px; gap: 2px; }
  .seg button { padding: 7px 14px; border-radius: 999px; border: none; background: transparent; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 600; color: var(--cs-muted); transition: all 180ms var(--cs-ease); display: inline-flex; align-items: center; gap: 6px; }
  .seg button:hover { color: var(--cs-ink-soft); }
  .seg button.on { background: #fff; color: var(--cs-ink); box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 4px 12px -4px rgba(0,0,0,0.1); }
  .seg button .n { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; background: rgba(0,0,0,0.06); padding: 1px 6px; border-radius: 999px; font-weight: 700; }
  .seg button.on .n { background: var(--cs-primary-soft); color: var(--cs-primary); }

  /* Toolbar */
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 18px 0; flex-wrap: wrap; }
  .search-mini { height: 36px; border: 1px solid var(--cs-line); background: #fff; border-radius: 999px; display: flex; align-items: center; gap: 8px; padding: 0 14px; min-width: 240px; transition: all 180ms var(--cs-ease); }
  .search-mini:focus-within { border-color: var(--cs-primary); box-shadow: var(--cs-shadow-focus); }
  .search-mini .material-symbols-outlined { font-size: 17px; color: var(--cs-muted); }
  .search-mini input { flex: 1; border: none; outline: none; background: transparent; font-family: inherit; font-size: 13px; color: var(--cs-ink); min-width: 0; }
  .search-mini input::placeholder { color: var(--cs-muted); }
  .toolbar-right { display: flex; gap: 8px; }

  /* Empty state */
  .empty { padding: 56px 24px; text-align: center; }
  .empty .icn { width: 64px; height: 64px; border-radius: 18px; background: var(--cs-primary-soft); color: var(--cs-primary); display: grid; place-items: center; margin: 0 auto 16px; }
  .empty .icn .material-symbols-outlined { font-size: 32px; font-variation-settings: 'FILL' 1; }
  .empty h3 { font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 16px; color: var(--cs-ink); margin: 0 0 6px; }
  .empty p { font-size: 13px; color: var(--cs-muted); margin: 0 0 16px; max-width: 360px; line-height: 1.55; margin-left: auto; margin-right: auto; }

  /* Page fade */
  .page-fade { animation: pageFade 280ms var(--cs-ease); }
  @keyframes pageFade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  /* ───────── My Posts ───────── */
  .post-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .post-row { display: grid; grid-template-columns: 96px 1fr auto; gap: 18px; padding: 16px; align-items: center; transition: all 200ms var(--cs-ease); cursor: pointer; }
  .post-row:hover { border-color: var(--cs-line-strong); box-shadow: var(--cs-shadow-md); transform: translateY(-1px); }
  .post-thumb { width: 96px; height: 96px; border-radius: 14px; background: linear-gradient(135deg, var(--c1, #d6e4f0), var(--c2, #5b87c0)); display: grid; place-items: center; color: rgba(255,255,255,0.95); font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -0.02em; flex-shrink: 0; position: relative; overflow: hidden; }
  .post-body { min-width: 0; }
  .post-title { font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 15.5px; color: var(--cs-ink); line-height: 1.4; margin: 0 0 6px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .post-meta-row { display: flex; gap: 14px; font-size: 12px; color: var(--cs-muted); flex-wrap: wrap; }
  .post-meta-row span { display: inline-flex; align-items: center; gap: 4px; }
  .post-meta-row .material-symbols-outlined { font-size: 13px; }
  .post-stats { margin-top: 10px; display: flex; gap: 16px; font-size: 12px; color: var(--cs-muted); }
  .post-stats b { font-family: 'Manrope', sans-serif; font-weight: 700; color: var(--cs-ink); margin-right: 3px; }
  .post-side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .post-price { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 18px; color: var(--cs-ink); letter-spacing: -0.01em; }
  .post-price .y { font-size: 11px; color: var(--cs-muted); font-weight: 600; margin-right: 1px; }
  .post-actions { display: flex; gap: 4px; }
  .post-action { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--cs-line); background: #fff; cursor: pointer; display: grid; place-items: center; color: var(--cs-muted); transition: all 140ms var(--cs-ease); }
  .post-action:hover { border-color: var(--cs-primary); color: var(--cs-primary); }
  .post-action.danger:hover { border-color: var(--rose); color: var(--rose); background: var(--rose-soft); }
  .post-action .material-symbols-outlined { font-size: 15px; }

  /* Status pills */
  .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; letter-spacing: 0.02em; }
  .pill::before { content: ''; width: 6px; height: 6px; border-radius: 999px; background: currentColor; }
  .pill.live { background: var(--green-soft); color: var(--green); }
  .pill.draft { background: rgba(0,0,0,0.04); color: var(--cs-muted); }
  .pill.review { background: var(--amber-soft); color: var(--amber); }
  .pill.sold { background: var(--blue-soft); color: var(--blue); }
  .pill.off { background: rgba(0,0,0,0.04); color: var(--cs-muted); }

  /* ───────── Orders ───────── */
  .order-card { padding: 0; overflow: hidden; }
  .order-head { display: flex; align-items: center; gap: 14px; padding: 12px 18px; background: rgba(0,0,0,0.025); border-bottom: 1px solid var(--cs-line); font-size: 12px; color: var(--cs-muted); flex-wrap: wrap; }
  .order-head .id { font-family: 'JetBrains Mono', monospace; color: var(--cs-ink-soft); font-weight: 600; }
  .order-head .sep { width: 4px; height: 4px; border-radius: 999px; background: var(--cs-muted-2); }
  .order-head .who { display: inline-flex; align-items: center; gap: 6px; }
  .order-head .who .av { width: 22px; height: 22px; border-radius: 999px; background: var(--cs-primary-soft); color: var(--cs-primary); font-size: 10px; font-weight: 700; display: grid; place-items: center; font-family: 'Manrope', sans-serif; }
  .order-head .status { margin-left: auto; }
  .order-body { display: grid; grid-template-columns: 72px 1fr auto; gap: 16px; padding: 16px 18px; align-items: center; }
  .order-thumb { width: 72px; height: 72px; border-radius: 12px; background: linear-gradient(135deg, var(--c1, #d6e4f0), var(--c2, #5b87c0)); display: grid; place-items: center; color: rgba(255,255,255,0.95); font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 22px; flex-shrink: 0; }
  .order-info { min-width: 0; }
  .order-info .t { font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 14.5px; color: var(--cs-ink); margin-bottom: 6px; }
  .order-info .sub { font-size: 12px; color: var(--cs-muted); line-height: 1.5; display: flex; gap: 12px; flex-wrap: wrap; }
  .order-info .sub .material-symbols-outlined { font-size: 13px; vertical-align: -2px; margin-right: 3px; }
  .order-side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0; }
  .order-foot { padding: 12px 18px; border-top: 1px dashed var(--cs-line); display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .order-foot .countdown { font-size: 12px; color: var(--amber); display: inline-flex; align-items: center; gap: 5px; font-weight: 600; }
  .order-foot .countdown .material-symbols-outlined { font-size: 14px; }
  .order-foot .countdown b { font-family: 'JetBrains Mono', monospace; color: var(--amber); }
  .order-btns { display: flex; gap: 6px; }
  .btn-sm { height: 32px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--cs-line); background: #fff; font-family: inherit; font-size: 12.5px; font-weight: 600; color: var(--cs-ink-soft); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; transition: all 160ms var(--cs-ease); }
  .btn-sm:hover { border-color: var(--cs-primary); color: var(--cs-primary); }
  .btn-sm.primary { background: linear-gradient(135deg, var(--cs-primary), var(--cs-accent)); color: #fff; border-color: transparent; box-shadow: 0 6px 14px -6px rgba(0,93,144,0.55); }
  .btn-sm.primary:hover { color: #fff; transform: translateY(-1px); }
  .btn-sm.danger { color: var(--rose); }
  .btn-sm.danger:hover { border-color: var(--rose); color: var(--rose); background: var(--rose-soft); }
  .btn-sm .material-symbols-outlined { font-size: 14px; }

  /* ───────── Messages ───────── */
  .msg-layout { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 0; height: calc(100vh - 200px); min-height: 560px; overflow: hidden; border-radius: var(--cs-r-lg); border: 1px solid var(--cs-line); background: #fff; box-shadow: var(--cs-shadow-sm); }
  @media (max-width: 900px) { .msg-layout { grid-template-columns: 1fr; height: auto; min-height: 0; } }
  .msg-list { border-right: 1px solid var(--cs-line); display: flex; flex-direction: column; min-height: 0; background: rgba(0,0,0,0.012); }
  .msg-list-head { padding: 14px 16px 12px; border-bottom: 1px solid var(--cs-line); background: #fff; }
  .msg-filter { display: flex; gap: 6px; margin-top: 12px; overflow-x: auto; overscroll-behavior-inline: contain; scroll-behavior: smooth; scrollbar-width: none; }
