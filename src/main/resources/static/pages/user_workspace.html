<!DOCTYPE html>
<html class="light" lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CampusShare 用户工作台</title>
<script src="/pages/assets/vendor/tailwindcss.js"></script>
<link href="/pages/assets/fonts/campusshare-fonts.css" rel="stylesheet"/>
<link href="/pages/assets/fonts/material-symbols.css" rel="stylesheet"/>
<link href="/pages/assets/css/campusshare-modern.css" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    primary: "#005d90",
                    "primary-strong": "#004b74",
                    "primary-soft": "#eef6fb",
                    surface: "#f5f5f7",
                    card: "#ffffff",
                    line: "rgba(120,133,150,0.16)",
                    muted: "#64748b",
                    ink: "#172033",
                    error: "#b42318"
                },
                borderRadius: { DEFAULT: "8px", md: "10px", lg: "12px", xl: "16px", full: "999px" },
                fontFamily: {
                    headline: ["Manrope", "Noto Sans SC", "Microsoft YaHei", "sans-serif"],
                    body: ["Inter", "Noto Sans SC", "Microsoft YaHei", "sans-serif"]
                }
            }
        }
    };
</script>
<style>
    * { box-sizing: border-box; }
    html { text-rendering: optimizeLegibility; }

    body {
        min-height: 100vh;
        margin: 0;
        font-family: var(--cs-font-body);
        color: var(--cs-ink);
        background:
            radial-gradient(circle at 12% 8%, rgba(0, 93, 144, 0.08), transparent 26rem),
            linear-gradient(180deg, #ffffff 0%, #f5f5f7 42%);
        text-wrap: pretty;
    }

    h1, h2, h3, .headline-font {
        font-family: var(--cs-font-headline);
        letter-spacing: 0;
    }

    .material-symbols-outlined {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        min-width: 32px;
        max-width: 32px;
        height: 32px;
        overflow: hidden;
        font-size: 21px;
        line-height: 1;
        text-align: center;
        font-variation-settings: "FILL" 0, "wght" 430, "GRAD" 0, "opsz" 24;
    }

    /* ----- Top bar ----- */
    [data-workspace-topbar] {
        height: 64px;
        border-bottom: 1px solid var(--cs-line);
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
    }

    [data-workspace-top-nav] {
        border-radius: var(--cs-radius-full);
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 600;
        color: var(--cs-muted);
        background: transparent;
        border: none;
        cursor: pointer;
        transition: background-color 180ms var(--cs-ease), color 180ms var(--cs-ease);
    }

    [data-workspace-top-nav][aria-current="page"] {
        color: var(--cs-primary);
        background: var(--cs-primary-soft);
    }

    [data-workspace-top-nav]:hover:not([aria-current="page"]) {
        background: rgba(120, 133, 150, 0.06);
        color: var(--cs-ink);
    }

    /* ----- Sidebar ----- */
    [data-workspace-sidebar] {
        position: fixed;
        left: 1rem;
        top: 4.75rem;
        width: 15rem;
        height: calc(100vh - 5.75rem);
        border: 1px solid var(--cs-line);
        border-radius: var(--cs-radius-xl);
        background: var(--cs-card-glass);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow: var(--cs-shadow-sm);
    }

    [data-workspace-sidebar] nav {
        gap: 2px;
    }

    [data-workspace-nav],
    [data-workspace-admin],
    [data-workspace-logout] {
        display: grid !important;
        grid-template-columns: 32px minmax(0, 1fr);
        align-items: center;
        width: 100%;
        min-height: 44px;
        column-gap: 12px;
        padding: 0 10px;
        border-radius: var(--cs-radius-md);
        font-size: 14px;
        font-weight: 500;
        background: transparent;
        border: none;
        cursor: pointer;
        text-align: left;
        color: var(--cs-muted);
        transition:
            background-color 180ms var(--cs-ease),
            color 180ms var(--cs-ease),
            transform 180ms var(--cs-ease);
        position: relative;
    }

    [data-workspace-nav] span:first-child,
    [data-workspace-admin] span:first-child,
    [data-workspace-logout] span:first-child {
        justify-self: center;
    }

    [data-workspace-nav] span:last-child,
    [data-workspace-admin] span:last-child,
    [data-workspace-logout] span:last-child {
        display: block;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        line-height: 1.25;
    }

    [data-workspace-nav][aria-current="page"] {
        background: var(--cs-primary-soft);
        color: var(--cs-primary);
        font-weight: 600;
    }

    [data-workspace-nav][aria-current="page"]::before {
        content: "";
        position: absolute;
        left: 0;
        top: 25%;
        bottom: 25%;
        width: 3px;
        background: var(--cs-primary);
        border-radius: 0 2px 2px 0;
    }

    [data-workspace-nav]:hover,
    [data-workspace-admin]:hover {
        background: rgba(120, 133, 150, 0.06);
        color: var(--cs-ink);
        transform: translateX(2px);
    }

    [data-workspace-logout] {
        color: var(--cs-error);
    }

    [data-workspace-logout]:hover {
        background: rgba(180, 35, 24, 0.06);
    }

    /* ----- Main frame area ----- */
    [data-workspace-main] {
        margin-left: 17rem;
        padding-top: 4.75rem;
        padding-right: 1rem;
        padding-bottom: 1rem;
    }

    [data-workspace-frame] {
        display: block;
        width: 100%;
        height: calc(100vh - 5.75rem);
        border: 1px solid var(--cs-line);
        border-radius: var(--cs-radius-xl);
        background: transparent;
        box-shadow: var(--cs-shadow-sm);
    }

    /* ----- Avatar ----- */
    [data-role="workspace-avatar"] {
        width: 44px;
        height: 44px;
        min-width: 44px;
        border-radius: var(--cs-radius-md);
        background: var(--cs-primary-soft);
        color: var(--cs-primary);
        font-size: 14px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    /* ----- Responsive ----- */
    @media (max-width: 900px) {
        [data-workspace-topbar] nav { display: none; }

        [data-workspace-sidebar] {
            position: static;
            width: auto;
            height: auto;
            margin: 4.5rem 1rem 1rem;
            border-radius: var(--cs-radius-xl);
        }

        [data-workspace-main] {
            margin-left: 0;
            padding: 0 1rem 1rem;
        }

        [data-workspace-frame] {
            height: calc(100vh - 18rem);
        }
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            transition-duration: 0.01ms !important;
            animation-duration: 0.01ms !important;
        }
    }
</style>
</head>
<body>

<!-- Top Bar -->
<header class="fixed left-0 right-0 top-0 z-50" data-workspace-topbar>
    <div class="flex h-full items-center justify-between px-6 lg:px-9">
        <button class="headline-font text-xl font-extrabold" data-workspace-brand type="button"
                style="color:var(--cs-primary);background:transparent;border:none;cursor:pointer;">
            CampusShare
        </button>
        <nav class="flex items-center gap-1">
            <button data-workspace-target="/pages/market_listing.html" data-workspace-top-nav type="button">交易市场</button>
            <button data-workspace-target="/pages/market_listing.html?view=MATERIAL" data-workspace-top-nav type="button">学术资源</button>
            <button data-workspace-target="/pages/market_listing.html?view=FORUM" data-workspace-top-nav type="button">校园论坛</button>
        </nav>
    </div>
</header>

<!-- Sidebar -->
<aside class="z-40 flex flex-col px-3 py-5" data-workspace-sidebar>

    <!-- Profile -->
    <div class="mb-4 flex items-center gap-3 px-2">
        <div data-role="workspace-avatar">用</div>
        <div class="min-w-0">
            <p class="truncate text-sm font-semibold" data-role="workspace-display-name"
               style="color:var(--cs-ink);">个人中心</p>
            <p class="truncate text-xs" data-role="workspace-role" style="color:var(--cs-muted);">校园认证用户</p>
        </div>
    </div>

    <!-- Nav -->
    <nav class="flex flex-1 flex-col">
        <button data-workspace-nav data-workspace-target="/pages/market_overview.html" type="button">
            <span class="material-symbols-outlined">home</span><span>主页</span>
        </button>
        <button data-workspace-nav data-workspace-target="/pages/my_publish.html" type="button">
            <span class="material-symbols-outlined">list_alt</span><span>我的发布</span>
        </button>
        <button data-workspace-nav data-workspace-target="/pages/order_center.html" type="button">
            <span class="material-symbols-outlined">receipt_long</span><span>订单中心</span>
        </button>
        <button data-workspace-nav data-workspace-target="/pages/recruitment_board.html" type="button">
            <span class="material-symbols-outlined">groups</span><span>团队招募</span>
        </button>
        <button data-workspace-nav data-workspace-target="/pages/notification_center.html" type="button">
            <span class="material-symbols-outlined">notifications</span><span>消息通知</span>
        </button>
        <button data-workspace-nav data-workspace-target="/pages/user_profile.html" type="button">
            <span class="material-symbols-outlined">settings</span><span>个人设置</span>
        </button>
        <button class="hidden" data-admin-only="true" data-workspace-admin type="button">
            <span class="material-symbols-outlined">admin_panel_settings</span><span>管理后台</span>
        </button>
    </nav>

    <!-- Bottom actions -->
    <div class="mt-3 border-t pt-3" style="border-color:var(--cs-line);">
        <button data-workspace-logout type="button">
            <span class="material-symbols-outlined">logout</span><span>退出登录</span>
        </button>
    </div>

</aside>

<!-- Main iframe -->
<main data-workspace-main>
    <iframe class="border-0" data-workspace-frame title="CampusShare 子页面"></iframe>
</main>

<script src="/pages/assets/js/campusshare-api.js?v=20260515"></script>
<script src="/pages/assets/js/user-workspace.js?v=20260515"></script>
</body>
</html>
