<!DOCTYPE html>
<html class="light" lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CampusShare 用户工作台</title>
<script src="/pages/assets/vendor/tailwindcss.js"></script>
<link href="/pages/assets/fonts/campusshare-fonts.css" rel="stylesheet"/>
<link href="/pages/assets/fonts/material-symbols.css" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    primary: "#005d90",
                    "primary-strong": "#004b74",
                    "on-primary": "#ffffff",
                    surface: "#f5f5f7",
                    "surface-card": "#ffffff",
                    "surface-soft": "#eef3f7",
                    line: "rgba(120,133,150,0.18)",
                    muted: "#667085",
                    ink: "#172033",
                    danger: "#b42318"
                },
                borderRadius: {
                    DEFAULT: "8px",
                    lg: "10px",
                    xl: "14px",
                    full: "999px"
                },
                fontFamily: {
                    headline: ["Manrope", "Noto Sans SC", "Microsoft YaHei", "sans-serif"],
                    body: ["Inter", "Noto Sans SC", "Microsoft YaHei", "sans-serif"]
                }
            }
        }
    };
</script>
<style>
    :root {
        --shell-bg: #f5f5f7;
        --shell-card: rgba(255, 255, 255, 0.82);
        --shell-line: rgba(120, 133, 150, 0.18);
        --shell-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
        --shell-ease: cubic-bezier(0.2, 0, 0, 1);
    }
    * { box-sizing: border-box; }
    html { text-rendering: optimizeLegibility; }
    body {
        min-height: 100vh;
        margin: 0;
        font-family: "Inter", "Noto Sans SC", "Microsoft YaHei", sans-serif;
        color: #172033;
        background:
            radial-gradient(circle at 12% 8%, rgba(0, 93, 144, 0.08), transparent 26rem),
            linear-gradient(180deg, #ffffff 0%, var(--shell-bg) 42%);
        text-wrap: pretty;
    }
    h1, h2, h3, .headline-font {
        font-family: "Manrope", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }
    button, a {
        transition: transform 180ms var(--shell-ease), color 180ms var(--shell-ease),
            background-color 180ms var(--shell-ease), box-shadow 180ms var(--shell-ease);
    }
    button:focus-visible, a:focus-visible, iframe:focus-visible {
        outline: 2px solid rgba(0, 93, 144, 0.34);
        outline-offset: 3px;
    }
    .material-symbols-outlined {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.25rem;
        min-width: 1.25rem;
        overflow: hidden;
        font-size: 1.25rem;
        line-height: 1;
        font-variation-settings: "FILL" 0, "wght" 430, "GRAD" 0, "opsz" 24;
    }
    [data-workspace-topbar] {
        height: 72px;
        border-bottom: 1px solid rgba(120, 133, 150, 0.12);
        background: rgba(255, 255, 255, 0.76);
        backdrop-filter: blur(18px);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.7);
    }
    [data-workspace-brand] {
        letter-spacing: 0;
    }
    [data-workspace-top-nav] {
        border-radius: 999px;
        color: #566273;
    }
    [data-workspace-top-nav][aria-current="page"] {
        color: #005d90;
        background: rgba(0, 93, 144, 0.08);
    }
    [data-workspace-sidebar] {
        left: 1.25rem;
        top: 5.75rem;
        width: 15rem;
        height: calc(100vh - 7rem);
        border: 1px solid var(--shell-line);
        border-radius: 16px;
        background: var(--shell-card);
        backdrop-filter: blur(20px);
        box-shadow: var(--shell-shadow);
    }
    [data-workspace-nav],
    [data-workspace-admin],
    [data-workspace-logout] {
        border-radius: 10px;
    }
    [data-workspace-nav][aria-current="page"] {
        background: #ffffff;
        color: #005d90;
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.07);
        font-weight: 800;
    }
    [data-workspace-nav]:hover,
    [data-workspace-admin]:hover {
        background: rgba(0, 93, 144, 0.07);
        color: #005d90;
        transform: translateX(2px);
    }
    [data-workspace-logout]:hover {
        background: rgba(180, 35, 24, 0.08);
    }
    [data-workspace-main] {
        margin-left: 17rem;
        padding-top: 5.75rem;
        padding-right: 1.25rem;
        padding-bottom: 1.25rem;
    }
    [data-workspace-frame] {
        height: calc(100vh - 7rem);
        border: 1px solid var(--shell-line);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.72);
        box-shadow: var(--shell-shadow);
    }
    @media (max-width: 900px) {
        [data-workspace-topbar] nav { display: none; }
        [data-workspace-sidebar] {
            position: static;
            width: auto;
            height: auto;
            margin: 5.5rem 1rem 1rem;
        }
        [data-workspace-main] {
            margin-left: 0;
            padding: 0 1rem 1rem;
        }
        [data-workspace-frame] { height: calc(100vh - 18rem); }
    }
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            transition-duration: 0.01ms !important;
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
        }
    }
</style>
</head>
<body>
<header class="fixed left-0 right-0 top-0 z-50" data-workspace-topbar>
    <div class="flex h-full items-center justify-between px-6 lg:px-9">
        <button type="button" class="headline-font text-xl font-extrabold text-[#005d90]" data-workspace-brand>CampusShare</button>
        <nav class="flex items-center gap-2 text-sm font-bold">
            <button type="button" class="px-4 py-2" data-workspace-top-nav data-workspace-target="/pages/market_listing.html">交易市场</button>
            <button type="button" class="px-4 py-2" data-workspace-top-nav data-workspace-target="/pages/market_listing.html?view=MATERIAL">学术资源</button>
            <button type="button" class="px-4 py-2" data-workspace-top-nav data-workspace-target="/pages/market_listing.html?view=FORUM">校园论坛</button>
        </nav>
    </div>
</header>

<aside class="fixed z-40 flex flex-col px-4 py-5" data-workspace-sidebar>
    <div class="mb-6 flex items-center gap-3 px-2">
        <div class="flex h-11 w-11 shrink-0 items-center justify-center overflow-hidden rounded-xl bg-[#eef6fb] text-sm font-bold text-[#005d90]" data-role="workspace-avatar">用</div>
        <div class="min-w-0">
            <p class="truncate text-sm font-extrabold text-slate-950" data-role="workspace-display-name">个人中心</p>
            <p class="truncate text-xs text-slate-500" data-role="workspace-role">校园认证用户</p>
        </div>
    </div>
    <nav class="flex flex-1 flex-col gap-1">
        <button type="button" class="flex w-full items-center gap-3 px-3 py-2.5 text-sm font-semibold text-slate-600" data-workspace-nav data-workspace-target="/pages/market_overview.html">
            <span class="material-symbols-outlined">home</span><span>主页</span>
        </button>
        <button type="button" class="flex w-full items-center gap-3 px-3 py-2.5 text-sm font-semibold text-slate-600" data-workspace-nav data-workspace-target="/pages/my_publish.html">
            <span class="material-symbols-outlined">list_alt</span><span>我的发布</span>
        </button>
        <button type="button" class="flex w-full items-center gap-3 px-3 py-2.5 text-sm font-semibold text-slate-600" data-workspace-nav data-workspace-target="/pages/order_center.html">
            <span class="material-symbols-outlined">receipt_long</span><span>订单中心</span>
        </button>
        <button type="button" class="flex w-full items-center gap-3 px-3 py-2.5 text-sm font-semibold text-slate-600" data-workspace-nav data-workspace-target="/pages/recruitment_board.html">
            <span class="material-symbols-outlined">groups</span><span>组队招募</span>
        </button>
        <button type="button" class="flex w-full items-center gap-3 px-3 py-2.5 text-sm font-semibold text-slate-600" data-workspace-nav data-workspace-target="/pages/notification_center.html">
            <span class="material-symbols-outlined">notifications</span><span>消息通知</span>
        </button>
        <button type="button" class="flex w-full items-center gap-3 px-3 py-2.5 text-sm font-semibold text-slate-600" data-workspace-nav data-workspace-target="/pages/user_profile.html">
            <span class="material-symbols-outlined">settings</span><span>个人设置</span>
        </button>
        <button type="button" class="hidden w-full items-center gap-3 px-3 py-2.5 text-sm font-semibold text-slate-600" data-admin-only="true" data-workspace-admin>
            <span class="material-symbols-outlined">admin_panel_settings</span><span>管理仪表盘</span>
        </button>
    </nav>
    <div class="mt-4 border-t border-[rgba(120,133,150,0.16)] pt-4">
        <button type="button" class="flex w-full items-center gap-3 px-3 py-2.5 text-sm font-semibold text-[#b42318]" data-workspace-logout>
            <span class="material-symbols-outlined">logout</span><span>退出登录</span>
        </button>
    </div>
</aside>

<main data-workspace-main>
    <iframe class="block w-full border-0" data-workspace-frame title="CampusShare 子页面"></iframe>
</main>

<script src="/pages/assets/js/campusshare-api.js?v=20260510-mojibake"></script>
<script src="/pages/assets/js/user-workspace.js?v=20260511-apple-shell"></script>
</body>
</html>
